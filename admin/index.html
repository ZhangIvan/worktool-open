<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WorkTool-Open 管理台</title>
<style>
  /* ===== WorkTool Open 管理台 · 浅色科技风视觉基线 =====
     冰白底 #f7f9fc · 白卡片 #ffffff（圆角 12px + subtle shadow）· 钴蓝主色 #2563eb
     深空蓝面板 #1e3a5f（拓扑/轨迹/链路等示意区）
     单文件内嵌 · 零外部资源（无 CDN/字体/图片，G3/G4 纪律）
     状态徽标：成功绿 / 失败红 / 等待黄 / 未知灰（颜色之外带文字） */
  :root {
    --bg:#f7f9fc; --panel:#ffffff; --panel2:#eef3fb; --line:#d9e2ef;
    --fg:#16243a; --dim:#5c6b84; --deep:#1e3a5f;
    --acc:#2563eb; --acc-dk:#1d4ed8; --acc-bg:#e8effd;
    --ok:#15803d; --ok-bg:#e7f6ec;
    --warn:#b45309; --warn-bg:#fdf3e0;
    --err:#dc2626; --err-bg:#fdeaea;
    --unk:#64748b; --unk-bg:#eef1f5;
    --mono:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
    --shadow:0 1px 2px rgba(22,36,58,.05), 0 2px 10px rgba(22,36,58,.07);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.65 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  /* 页面顶部极光渐变（纯渐变，无图片） */
  body::before { content:""; position:fixed; top:0; left:0; right:0; height:280px; z-index:-1;
    background:
      radial-gradient(560px 200px at 18% -40px, rgba(191,214,255,.55), rgba(191,214,255,0) 70%),
      radial-gradient(700px 240px at 78% -60px, rgba(154,190,247,.42), rgba(154,190,247,0) 72%),
      linear-gradient(180deg, rgba(240,246,255,.9), rgba(247,249,252,0)); }
  /* ===== 顶栏：白底 · logo + 五导航 + 环境徽标 ===== */
  #topbar { position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
            gap:14px; height:58px; padding:0 22px; background:rgba(255,255,255,.92);
            border-bottom:1px solid var(--line); box-shadow:0 1px 8px rgba(22,36,58,.05); }
  .tb-left { display:flex; align-items:center; gap:20px; min-width:0; }
  .brand { display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--fg);
           font-size:17px; font-weight:800; letter-spacing:.2px; white-space:nowrap; }
  .brand .logo { display:inline-flex; }
  #nav { display:flex; align-items:center; gap:4px; min-width:0; overflow-x:auto; }
  #nav a { position:relative; display:inline-block; padding:17px 14px 15px; color:var(--fg);
           text-decoration:none; font-size:14.5px; font-weight:600; white-space:nowrap; }
  #nav a:hover { color:var(--acc-dk); }
  #nav a.active { color:var(--acc); }
  #nav a.active::after { content:""; position:absolute; left:12px; right:12px; bottom:0;
                         height:3px; border-radius:3px 3px 0 0; background:var(--acc); }
  .tb-right { display:flex; align-items:center; gap:10px; }
  .env-pill { font-size:11.5px; color:var(--dim); background:var(--panel2);
              border:1px solid var(--line); border-radius:9px; padding:2px 10px; white-space:nowrap; }
  #sync-time { color:var(--dim); font-size:11px; font-family:var(--mono); white-space:nowrap; }
  .tb-sep { width:1px; height:20px; background:var(--line); }
  /* ===== 内容区 ===== */
  #content { max-width:1400px; margin:0 auto; padding:18px 26px 40px; }
  #content a { color:var(--acc-dk); }
  /* 面包屑 + 页头 */
  .crumb { font-size:12.5px; color:var(--dim); margin:2px 0 4px; }
  .crumb a { color:var(--acc-dk); text-decoration:none; }
  .crumb a:hover { text-decoration:underline; }
  .eyebrow { margin:10px 0 0; font-size:11px; font-weight:700; letter-spacing:3px; color:#5f7db0; }
  .pagehead { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin:0 0 16px; }
  .pagehead h1 { margin:2px 0 0; font-size:30px; line-height:1.25; font-weight:800; color:var(--fg); letter-spacing:.3px; }
  .pagehead h1 .title-date { font-size:15px; color:var(--dim); font-weight:400; margin-left:12px; }
  .pagesub { margin:4px 0 0; color:var(--dim); font-size:13.5px; }
  .pageacts { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; padding-top:18px; }
  /* ===== 按钮 ===== */
  input, select, textarea, button { background:#ffffff; color:var(--fg); border:1px solid var(--line);
           border-radius:9px; padding:6px 11px; font:inherit; }
  textarea { font-family:var(--mono); font-size:12.5px; width:100%; }
  button { cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button:disabled { opacity:.45; cursor:not-allowed; border-color:var(--line); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#ffffff; font-weight:600; }
  button.primary:hover:not(:disabled) { background:var(--acc-dk); }
  button.ghost { background:#ffffff; border-color:var(--line); color:var(--fg); }
  button.blue-soft { background:var(--acc-bg); border-color:var(--acc); color:var(--acc-dk); font-weight:600; }
  button.ok { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  button.no { background:var(--err-bg); border-color:var(--err); color:var(--err); }
  button.warn { background:var(--warn-bg); border-color:var(--warn); color:var(--warn); }
  button.mini { padding:2px 10px; font-size:12px; border-radius:8px; }
  .btnlink { display:inline-block; border:1px solid var(--acc); color:var(--acc-dk); background:var(--acc-bg);
             border-radius:9px; padding:5px 14px; text-decoration:none; font-size:13px; }
  /* ===== 卡片 ===== */
  section.card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
                 box-shadow:var(--shadow); padding:15px 18px; margin:0 0 16px; }
  section.card > h3 { margin:0 0 10px; font-size:14.5px; color:var(--fg); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  section.card > h3 .hint { color:var(--dim); font-weight:400; font-size:11.5px; }
  section.card > h3 .headlink { margin-left:auto; font-size:12.5px; font-weight:600; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .row label { display:flex; gap:5px; align-items:center; font-size:13px; color:var(--dim); }
  /* ===== 大数字统计带（工作台/设备中心页头下） ===== */
  .statband { display:flex; align-items:center; gap:0; flex-wrap:wrap; margin:0 0 18px;
              background:var(--panel); border:1px solid var(--line); border-radius:12px;
              box-shadow:var(--shadow); padding:10px 6px; }
  .sb-item { display:flex; align-items:center; gap:10px; padding:6px 22px; border-right:1px solid var(--line); white-space:nowrap; }
  .sb-item:last-child { border-right:none; }
  .sb-item .k { color:var(--dim); font-size:13px; }
  .sb-item .v { font-size:30px; font-weight:800; font-family:var(--mono); color:var(--fg); line-height:1; }
  .sb-item .v small { font-size:12px; color:var(--dim); font-weight:400; }
  .sb-tag { display:inline-block; font-size:12px; color:var(--acc-dk); background:var(--acc-bg);
            border:1px solid var(--acc); border-radius:9px; padding:2px 10px; font-weight:600; }
  /* ===== 表格 ===== */
  table { width:100%; border-collapse:collapse; font-size:12.8px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  thead th { background:var(--panel2); color:var(--dim); font-weight:600; white-space:nowrap; }
  thead th:first-child { border-radius:8px 0 0 8px; } thead th:last-child { border-radius:0 8px 8px 0; }
  tbody tr.click { cursor:pointer; }
  tbody tr.click:hover td, tbody tr:hover td { background:#f0f6ff; }
  td.mono, .mono { font-family:var(--mono); font-size:12px; }
  .cell-main { font-weight:600; }
  .cell-sub { color:var(--dim); font-size:11.5px; }
  /* ===== 状态徽标（胶囊） ===== */
  .pill { display:inline-block; padding:1px 10px; border-radius:11px; font-size:11.5px;
          border:1px solid var(--line); background:var(--panel2); color:var(--dim); white-space:nowrap; }
  .pill.on, .pill.st-delivered, .pill.st-succeeded, .pill.st-active { color:var(--ok); border-color:var(--ok); background:var(--ok-bg); }
  .pill.off, .pill.st-dead, .pill.st-failed, .pill.st-revoked, .pill.st-paused,
  .pill.st-expired, .pill.st-rejected, .pill.st-cancelled { color:var(--err); border-color:var(--err); background:var(--err-bg); }
  .pill.st-pending, .pill.warn, .pill.dry, .pill.st-awaiting_approval { color:var(--warn); border-color:var(--warn); background:var(--warn-bg); }
  .pill.st-skipped, .pill.unk, .pill.st-execution_unknown { color:var(--unk); border-color:var(--unk); background:var(--unk-bg); }
  .pill.L2 { color:var(--err); border-color:var(--err); background:var(--err-bg); }
  .pill.L1 { color:var(--warn); border-color:var(--warn); background:var(--warn-bg); }
  .pill.L0 { color:var(--ok); border-color:var(--ok); background:var(--ok-bg); }
  .pill.st-queued, .pill.st-dispatched, .pill.st-acked, .pill.st-running { color:var(--acc-dk); border-color:var(--acc); background:var(--acc-bg); }
  .pill.edge { color:var(--acc-dk); border-color:var(--acc); background:var(--acc-bg); font-family:var(--mono); }
  .pill.edge.term { color:var(--ok); border-color:var(--ok); background:var(--ok-bg); }
  .pill.edge.unk { color:var(--unk); border-color:var(--unk); background:var(--unk-bg); }
  .pill.cb1 { color:var(--acc-dk); border-color:var(--acc); background:var(--acc-bg); }
  .pill.cb11 { color:var(--ok); border-color:var(--ok); background:var(--ok-bg); }
  .pill.big { font-size:12.5px; padding:3px 12px; border-radius:13px; font-weight:600; }
  .dim { color:var(--dim); }
  .empty { color:var(--dim); padding:10px 0; }
  .errline { color:var(--err); font-family:var(--mono); font-size:12px; }
  #banner { background:var(--err-bg); border:1px solid var(--err); color:#8f1d1d; border-radius:10px;
            padding:8px 12px; margin:0 0 12px; display:none; }
  #okmsg { background:var(--ok-bg); border:1px solid var(--ok); color:#14532d; border-radius:10px;
           padding:8px 12px; margin:0 0 12px; display:none; }
  pre.json { background:#0f1e33; color:#d7e4f7; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
             font-family:var(--mono); font-size:12px; overflow-x:auto; margin:8px 0; white-space:pre-wrap; word-break:break-all; }
  /* ===== 深空蓝面板（拓扑/任务轨迹/链路/计划预览） ===== */
  .darkpanel { position:relative; overflow:hidden; border-radius:14px; color:#dce9fb;
               background:linear-gradient(140deg,#28496e 0%,#1e3a5f 34%,#12283f 68%,#0b1a2e 100%);
               border:1px solid #173250; box-shadow:var(--shadow); padding:16px 18px; margin:0 0 16px; }
  .darkpanel::before { content:""; position:absolute; right:-70px; top:-90px; width:280px; height:280px;
               border-radius:50%; border:1px solid rgba(120,170,240,.22); pointer-events:none; }
  .darkpanel::after { content:""; position:absolute; right:-20px; top:-40px; width:180px; height:180px;
               border-radius:50%; border:1px solid rgba(120,170,240,.16); pointer-events:none; }
  .darkpanel h3, .darkpanel h2 { color:#f2f7ff; margin:0; }
  .dp-head { display:flex; align-items:center; gap:10px; margin:0 0 10px; position:relative; z-index:1; }
  .dp-head h3 { font-size:16px; }
  .dp-pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:#cfe2fc;
             border:1px solid rgba(140,180,240,.45); background:rgba(80,130,200,.18); border-radius:11px; padding:2px 10px; }
  .dp-foot { display:flex; align-items:center; gap:7px; font-size:12px; color:#9db8dc; margin-top:10px; position:relative; z-index:1; }
  .dp-meta { color:#a8c2e6; font-size:12.5px; }
  /* 深色统计带（任务中心） */
  .bandstats { display:flex; align-items:center; flex-wrap:wrap; gap:4px 0; position:relative; z-index:1; }
  .bandstats .bs { display:flex; align-items:center; gap:12px; padding:8px 26px; border-right:1px solid rgba(130,170,225,.25); }
  .bandstats .bs:last-child { border-right:none; }
  .bs .ic-circ { width:40px; height:40px; border-radius:50%; border:1.6px solid rgba(150,190,245,.55);
                 display:flex; align-items:center; justify-content:center; color:#bcd6fa; flex:none; }
  .bs .k { color:#c7dbf7; font-size:13px; }
  .bs .v { font-size:30px; font-weight:800; color:#ffffff; font-family:var(--mono); line-height:1.05; }
  .bs .s { color:#8fb0da; font-size:11px; }
  /* 深色流程节点带（任务轨迹 hero / 回调链路 / 连通性） */
  .dpflow { display:flex; align-items:flex-start; justify-content:space-between; position:relative; z-index:1;
            margin:14px 0 4px; padding:0 8px; }
  .dpflow::before { content:""; position:absolute; left:6%; right:6%; top:27px; height:2px;
                    background:linear-gradient(90deg, rgba(110,160,235,.15), rgba(110,160,235,.5), rgba(110,160,235,.15)); }
  .fl-node { position:relative; text-align:center; width:23%; min-width:96px; }
  .fl-node .c { width:56px; height:56px; margin:0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center;
                border:1.6px solid rgba(150,190,245,.5); background:rgba(20,45,80,.55); color:#bcd6fa; position:relative; z-index:1; }
  .fl-node.done .c { border-color:rgba(110,160,235,.85); color:#e6f1ff; }
  .fl-node.active .c { border-color:#7db2f5; color:#ffffff; background:rgba(37,99,235,.4);
                       box-shadow:0 0 0 5px rgba(37,99,235,.18), 0 0 18px rgba(96,165,250,.5); }
  .fl-node.ok .c { border-color:#4ade80; color:#bbf7d0; }
  .fl-node.err .c { border-color:#f87171; color:#fecaca; }
  .fl-node.unk .c { border-color:#fbbf24; color:#fde68a; box-shadow:0 0 0 4px rgba(251,191,36,.12); }
  .fl-node .t { margin-top:8px; font-size:13.5px; font-weight:700; color:#f0f6ff; }
  .fl-node .d { font-size:11.5px; color:#9db8dc; margin-top:1px; }
  .fl-line { position:absolute; left:6%; right:6%; top:27px; height:2px; }
  /* 拓扑 */
  .topo-stage { position:relative; height:320px; z-index:1; }
  .topo-lines { position:absolute; inset:0; width:100%; height:100%; }
  .topo-lines line { stroke-width:1.1; }
  .topo-lines .tl-on { stroke:rgba(110,165,250,.6); }
  .topo-lines .tl-off { stroke:rgba(148,163,184,.35); stroke-dasharray:3 4; }
  .topo-hub { position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); text-align:center; z-index:2; }
  .hub-core { width:74px; height:74px; margin:0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center;
              background:radial-gradient(circle at 34% 30%, #3b74d9, #1e3a8a 68%, #132a5c);
              box-shadow:0 0 0 7px rgba(59,116,217,.16), 0 0 26px rgba(96,165,250,.45); color:#eaf2ff; }
  .hub-label { margin-top:7px; font-size:11.5px; color:#bcd6fa; }
  .topo-chip { position:absolute; transform:translate(-50%,-50%); text-align:center; z-index:2; cursor:pointer;
               background:rgba(13,30,54,.66); border:1px solid rgba(110,160,235,.3); border-radius:12px;
               padding:8px 12px 6px; min-width:96px; }
  .topo-chip:hover { border-color:rgba(140,185,250,.7); }
  .topo-chip .tc-name { font-size:12px; font-weight:700; color:#f0f6ff; margin-top:4px; }
  .topo-chip .tc-st { font-size:10.5px; margin-top:2px; display:flex; gap:5px; align-items:center; justify-content:center; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; }
  .dot.on { background:#60a5fa; box-shadow:0 0 6px rgba(96,165,250,.9); }
  .dot.off { background:#94a3b8; }
  .topo-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#9db8dc; z-index:1; }
  /* 设备迷你拓扑/深色设备卡里的手机 */
  .phone { position:relative; border-radius:13px; border:2px solid rgba(255,255,255,.4);
           background:linear-gradient(165deg,#e4efff 0%,#9cc2f7 45%,#3f77d8 100%);
           box-shadow:0 10px 26px rgba(3,14,34,.5), inset 0 0 0 3px rgba(9,25,51,.55); }
  .phone::before { content:""; position:absolute; top:6px; left:50%; transform:translateX(-50%);
                   width:24%; height:5px; border-radius:3px; background:rgba(9,25,51,.5); }
  .phone::after { content:""; position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
                  width:32%; height:4px; border-radius:2px; background:rgba(255,255,255,.55); }
  .phone.lg { width:118px; height:228px; }
  .phone.md { width:82px; height:158px; }
  .phone.sm { width:30px; height:56px; border-radius:7px; border-width:1.5px; box-shadow:0 4px 10px rgba(3,14,34,.45); }
  .phone.sm::before { top:4px; height:3px; } .phone.sm::after { display:none; }
  .devcard-hero { display:flex; gap:18px; align-items:center; position:relative; z-index:1; }
  .devcard-hero .dc-name { font-size:21px; font-weight:800; color:#f4f8ff; }
  .kvrow { display:flex; justify-content:space-between; gap:14px; padding:8px 2px; border-bottom:1px dashed var(--line); font-size:13px; }
  .kvrow:last-child { border-bottom:none; }
  .kvrow .k { color:var(--dim); white-space:nowrap; }
  .kvrow .v { text-align:right; word-break:break-all; }
  .darkpanel .kvrow { border-bottom:1px dashed rgba(130,170,225,.28); }
  .darkpanel .kvrow .k { color:#9db8dc; } .darkpanel .kvrow .v { color:#eaf2ff; }
  /* ===== 提示带（黄/蓝/红） ===== */
  .warnband { background:#fdf6e7; border:1px solid #f0d9a6; color:#8a5a12; border-radius:11px;
              padding:9px 14px; margin:0 0 14px; font-size:13px; display:flex; gap:9px; align-items:flex-start; }
  .warnband .ic { flex:none; margin-top:2px; color:#d97706; }
  .infoband { background:#e9f2fe; border:1px solid #cfe1fc; color:#1e40af; border-radius:11px;
              padding:9px 14px; margin:0 0 14px; font-size:13px; display:flex; gap:9px; align-items:flex-start; }
  .infoband .ic { flex:none; margin-top:2px; color:var(--acc); }
  .errband { background:var(--err-bg); border:1px solid #f3b8b8; color:#8f1d1d; border-radius:11px;
             padding:9px 14px; margin:0 0 14px; font-size:13px; display:flex; gap:9px; align-items:center; }
  .oknote { background:var(--ok-bg); border:1px solid var(--ok); color:#14532d; border-radius:10px;
            padding:8px 12px; margin:8px 0; font-size:12.8px; }
  .warnbox { background:var(--warn-bg); border:1px solid var(--warn); color:#7a4106; border-radius:10px;
             padding:8px 12px; margin:8px 0; font-size:12.8px; }
  .warnbox a { color:#7a4106; }
  .approvebox { background:var(--warn-bg); border:1px solid var(--warn); color:#7a4106; border-radius:10px;
             padding:10px 12px; margin:8px 0; font-size:13px; }
  .stalebox { background:var(--warn-bg); border:1px dashed var(--warn); color:#7a4106; border-radius:8px;
             padding:5px 10px; margin:6px 0; font-size:12.3px; }
  .gatereasons { color:var(--err); font-size:12.3px; }
  .quotebox { background:var(--acc-bg); border:1px solid #cfe1fc; border-radius:11px; padding:10px 14px;
              font-size:13px; color:#1e3a8a; display:flex; gap:9px; align-items:flex-start; margin:10px 0; }
  .quotebox .ic { flex:none; margin-top:2px; color:var(--acc); }
  /* ===== 引导步骤条（新建任务六步 / 配对三步 / OpenAPI 三步 / 队列生命周期） ===== */
  .steps { display:flex; align-items:center; gap:0; flex-wrap:wrap; margin:0 0 16px;
           background:var(--panel); border:1px solid var(--line); border-radius:12px;
           box-shadow:var(--shadow); padding:10px 16px; }
  .step { display:flex; align-items:center; gap:9px; padding:2px 4px; white-space:nowrap; }
  .step .n { width:30px; height:30px; border-radius:50%; border:1.6px solid var(--line); background:#ffffff;
             display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--dim); flex:none; }
  .step .t { font-size:13.5px; color:var(--dim); font-weight:600; }
  .step-line { flex:1 1 18px; min-width:18px; height:2px; background:var(--line); margin:0 10px; }
  .step.done .n { border-color:var(--acc); background:var(--acc-bg); color:var(--acc-dk); }

      if (cmdsLoaded) return;

      setState($("dd-cmds"), "loading", 5);
      api("GET", "/api/v1/admin/commands?target=" + encodeURIComponent(d.deviceId) + "&limit=20").then(function (j) {
        var rows = (j.commands || []).map(function (c) {
          return "<tr><td class='mono'>" + fmtMs(c.createdAtMs) + "</td><td>" + typeCell(c.type) + "</td>" +
            "<td>" + stPill(c.state) + "</td><td>" + riskPill(c.riskClass) + "</td>" +
            "<td><a href='#/tasks-current?id=" + encodeURIComponent(c.commandId) + "'>详情</a></td></tr>";
        });
        $("dd-cmds").innerHTML = rows.join("") || "<tr><td colspan='5' class='empty'>该设备暂无任务记录。</td></tr>";
      }).catch(function (e) {
        setState($("dd-cmds"), (e && e.timeout) ? "timeout" : "error", 5, "", errName(e));
        cmdsLoaded = false;
      });
    }
    function loadEvents() {
      if (eventsLoaded) return;
      eventsLoaded = true;
      setState($("dd-events"), "loading", 4);
      api("GET", "/api/v1/admin/logs/audit?limit=200").then(function (j) {
        var rows = (j.entries || []).filter(function (e) {
          return String(e.subject || "").indexOf(d.deviceId) >= 0 || String(e.detail || "").indexOf(d.deviceId) >= 0;
        }).slice(0, 30).map(function (e) {
          var n = auditNarrative(e);
          return "<tr><td class='mono'>" + fmtMs(e.atMs) + "</td><td>" + esc(n.actor) + "</td>" +
            "<td><b>" + esc(n.action) + "</b></td><td class='dim mono' style='word-break:break-all'>" + esc(n.extra || "—") + "</td></tr>";
        });
        $("dd-events").innerHTML = rows.join("") || "<tr><td colspan='4' class='empty'>暂无与本设备相关的审计事件。</td></tr>";
      }).catch(function (e) {
        setState($("dd-events"), (e && e.timeout) ? "timeout" : "error", 4, "", errName(e));
        eventsLoaded = false;
      });
    }
  }
}

function markSteps() {
  if (!$("ws-s1")) return;
  var order = ["ws-s1", "ws-s2", "ws-s3", "ws-s4"];
  var dryDone = WIZ.dryReport !== undefined && WIZ.dryReport !== null;
  var activeSet = false;
  order.forEach(function (id, i) {
    var el = $(id);
    if (!el) return;
    var isDone = (i === 0 && !!WIZ.deviceId) || ((i === 1 || i === 2) && !!WIZ.type) || (i === 3 && dryDone);
    if (isDone) el.className = "done";
    else if (!activeSet) { el.className = "active"; activeSet = true; }
    else el.className = "";
  });
}
function loadDevicesForSend() {
  $("send-devnote").textContent = "加载中…";

    WIZ.devices = j.devices || [];
    WIZ.devicesLoaded = true;
    WIZ.devicesStale = false;
    clearStale("send-dev-stale");
    $("send-devnote").textContent = "";
    fillDeviceSelect();
  }).catch(function (e) {
    if (WIZ.devicesLoaded) {
      // 保留旧列表 + 陈旧提示；提交门按陈旧禁用（wizardGate.devicesStale）
      WIZ.devicesStale = true;
      setStale("send-dev-stale", (e && e.timeout) ? "刷新超时" : "刷新失败");
      $("send-devnote").textContent = "";
      fillDeviceSelect();
    } else {
      $("send-device").innerHTML = "<option value=''>" + ((e && e.timeout) ? "设备列表加载超时——点「刷新设备」重试" : "设备列表加载失败——点「刷新设备」重试") + "</option>";
      $("send-devnote").textContent = "";
      onDeviceChange();
    }
  });
}

  var sel = $("send-device");
  if (!WIZ.devices.length) {

    line.innerHTML = "<span class='pill on'>已批准</span>" + (hit.approver ? " · 决议人 " + esc(hit.approver) : "") + (hit.decidedAtMs ? " · " + fmtMs(hit.decidedAtMs) : "");

    var go = $("ap-go");
    if (go) go.onclick = submitWithApproval;
  } else if (hit.status === "rejected") {
    line.innerHTML = "<span class='pill st-rejected'>已拒绝</span>" + (hit.reason ? " · 原因：" + esc(hit.reason) : "");
    if (acts) acts.innerHTML = "<span class='dim'>如仍需执行：修改内容后重新提交（会生成新审批申请）。</span>";

    line.innerHTML = "<span class='pill on'>已批准并消费</span> · 任务已入队——<a href='#/tasks-history'>到任务中心查看</a>";
    WIZ.approval = null;

    line.innerHTML = "<span class='pill st-pending'>待决议</span> · 登记时间 " + fmtMs(hit.createdAtMs);

function submitWithApproval() {
  var a = WIZ.approval, b = WIZ.lastBody;

    approvalId: a.approvalId, idempotencyKey: idemKey("real")
  }).then(function (j) {

function taskDeliverySection(commandId) {

function taskEventStreamSection(commandId) {

  return api("GET", "/api/v1/admin/logs/executions?commandId=" + encodeURIComponent(commandId) + "&limit=50").then(function (j) {
    var evs = j.events || [];

    var last = evs[0];
    return "<p class='dim'>全局事件流（logs/executions?commandId= 过滤）共 " + evs.length + " 条 · 最后事件 " +
      edgePill(last.edge) + " " + esc(stName(last.fromState)) + " → " + esc(stName(last.toState)) + " · <span class='mono'>" + fmtMs(last.atMs) + "</span></p>" +

function heroStepperNodes(c) {
  var st = (c && c.state) || "";
  var idx = st === "queued" ? 0 : st === "dispatched" ? 1 : (st === "acked" || st === "running") ? 2 : 3;
  var nodes = [
    { t: "排队", ic: ico("layers", 20) },
    { t: "下发", ic: ico("arrow", 20) },
    { t: "设备回执", ic: ico("phone", 20) },
    { t: "结果验证", ic: ico("search", 20) }
  ];
  var subs = ["等待调度", "尚未开始", "尚未收到", "尚未开始"];
  var doneSubs = ["已入队", "已下发", "设备已接收", "已出终态"];
  if (TERMINAL_STATES[st] || (c && c.terminalState)) {
    // 终态：前 3 节点 done，末节点按终态着色
    nodes = nodes.map(function (n, i) {
      if (i < 3) return { t: n.t, ic: n.ic, st: "done", d: doneSubs[i] };
      var tone = st === "succeeded" ? "ok" : st === "failed" ? "err" : st === "execution_unknown" ? "unk" : "";
      return { t: n.t, ic: n.ic, st: tone, d: stName(st) };
    });
    return nodes;
  }
  return nodes.map(function (n, i) {
    if (i < idx) return { t: n.t, ic: n.ic, st: "done", d: doneSubs[i] };
    if (i === idx) return { t: n.t, ic: n.ic, st: "active", d: i === 2 && st === "running" ? "执行中" : subs[i] };
    return { t: n.t, ic: n.ic, st: "", d: subs[i] };
  });
}

    var names = ["已下发（示例）", "等待回执", "待核对"];

  $("approver-token").value = approverToken;

  $("save-approver-token").onclick = function () {

  function fillExpl() {

      : "<span style='color:var(--warn)'>目录未载——L2 清单暂不可用，请切页重试（分级口径以服务端目录/设置页分级查询为准）</span>";

  function decide(id, decision) {

        { t: "入队等待", d: "待申请人携审批号提交", st: "cur" },
        { t: "执行回执", d: "尚未开始", st: "" }
      ]);
    } else if (a.status === "consumed") {
      flow = vsteps([
        { t: "申请已提交", d: fmtMs(a.createdAtMs), st: "done" },
        { t: "已批准并消费", d: "任务已入队", st: "done" },
        { t: "入队等待", d: "已进入待派发队列", st: "done" },
        { t: "执行回执", d: "到「任务中心」跟踪", st: "" }
      ]);
    } else {
      flow = vsteps([
        { t: "申请已提交", d: fmtMs(a.createdAtMs), st: "done" },
        { t: "已拒绝", d: (a.approver ? "决议人 " + esc(a.approver) + " · " : "") + (a.reason ? "原因：" + esc(a.reason) : "（未记录原因）"), st: "err" },
        { t: "入队等待", d: "流程终止——如仍需执行请修改后重新提交", st: "" },
        { t: "执行回执", d: "不会发生", st: "" }

      "<div class='statband' style='margin:10px 0 12px;padding:4px 2px'>" +
      "<div class='sb-item'><span class='k'>目标设备</span><span class='v mono' style='font-size:15px;font-family:var(--mono);font-weight:700'>" + esc(shortIdPlain(a.target)) + "</span></div>" +
      "<div class='sb-item'><span class='k'>申请人</span><span class='v' style='font-size:15px;font-family:inherit;font-weight:700'>" + esc(a.actor || "—") + "</span></div>" +
      "<div class='sb-item'><span class='k'>指令类型</span><span class='v' style='font-size:15px;font-family:inherit;font-weight:700'>" + typeCell(a.type) + "</span></div>" +
      "<div class='sb-item'><span class='k'>登记时间</span><span class='v mono' style='font-size:15px;font-family:var(--mono);font-weight:700'>" + fmtMs(a.createdAtMs) + "</span></div>" +
      "</div>" +
      "<div class='warnband'>" + ico("warn") + "<span><b>审批通过后进入队列，不代表执行完成</b>——批准后仍需申请人携审批号提交执行；参数修改会使原审批失效。</span></div>" +
      "<div class='grid2'>" +

  function stNameAp(s) { return { pending: "待决议", approved: "已批准", rejected: "已拒绝", consumed: "已批准并消费" }[s] || s; }

        AP_CACHE = j.approvals || [];
        var pendCount = AP_CACHE.filter(function (x) { return x.status === "pending"; }).length;
        if ($("ap-status").value === "pending") $("ap-headcount").textContent = "待审批 " + pendCount;
        else $("ap-headcount").textContent = "当前筛选 " + AP_CACHE.length + " 条";

          return "<tr class='click' data-aprow='" + esc(a.approvalId) + "'><td>" + shortId(a.approvalId) + "</td><td>" + esc(a.actor) + "</td>" +
            "<td class='mono'>" + esc(shortIdPlain(a.target)) + "</td><td>" + typeCell(a.type) + (a.recurring ? " <span class='pill warn'>常设</span>" : "") + "</td>" +
            "<td>" + riskPill(a.riskClass) + "</td>" +
            "<td><span class='pill " + (a.status === "pending" ? "st-pending" : a.status === "rejected" ? "st-rejected" : "on") + "'>" + esc(stNameAp(a.status)) + "</span></td>" +
            "<td>" + esc(a.reason || "—") + "</td>" +
            "<td class='mono'>" + fmtMs(a.createdAtMs) + "</td>" +
            "<td><a href='#/tasks-approvals' data-apview='" + esc(a.approvalId) + "'>详情</a></td></tr>";
        });
        $("approvals-body").innerHTML = rows.join("") || "<tr><td colspan='9' class='empty'>无该状态审批</td></tr>";
        forEach("[data-aprow]", function (tr) {
          tr.onclick = function (ev) {
            if (ev.target && ev.target.tagName && String(ev.target.tagName).toLowerCase() === "a") return;
            var a = AP_CACHE.filter(function (x) { return x.approvalId === tr.getAttribute("data-aprow"); })[0];
            if (a) renderApDetail(a);
          };
        });
        if (AP_SEL) {
          var sel = AP_CACHE.filter(function (x) { return x.approvalId === AP_SEL; })[0];
          if (sel) { renderApDetail(sel); return; }
          AP_SEL = "";
        }
        if (AP_CACHE.length) renderApDetail(AP_CACHE[0]);
        else $("ap-detail").innerHTML = "<div class='empty'>无该状态审批——切换状态筛选查看其他记录。</div>";
      }).catch(function (e) {
        setState($("approvals-body"), (e && e.timeout) ? "timeout" : "error", 9, "", errName(e));
      });
    });
  }
  $("refresh-approvals").onclick = load;
  $("ap-status").onchange = load;
  load();
}

    "<div><section class='card' id='al-detail'><h3>变更详情 <span class='hint'>不可编辑</span></h3><div class='empty'>点左侧审计行查看对象、操作者与证据。</div></section></div>" +
    "</div>";
  function renderDetail(e) {
    var n = auditNarrative(e);
    $("al-detail").innerHTML =
      "<h3>变更详情 <span class='hint'>不可编辑</span></h3>" +
      "<div class='kvrow'><span class='k'>对象</span><span class='v mono'>" + esc(n.object) + "</span></div>" +
      "<div class='kvrow'><span class='k'>操作者</span><span class='v'>" + esc(n.actor) + "</span></div>" +
      "<div class='kvrow'><span class='k'>时间</span><span class='v mono'>" + fmtMs(e.atMs) + " <span class='dim'>（ISO " + esc(new Date(e.atMs).toISOString()) + "）</span></span></div>" +
      "<div class='kvrow'><span class='k'>动作</span><span class='v'><b>" + esc(n.action) + "</b></span></div>" +
      "<div class='kvrow'><span class='k'>事件类型</span><span class='v mono'>" + esc(e.kind || "—") + "</span></div>" +
      (n.extra ? "<div class='kvrow'><span class='k'>证据摘要</span><span class='v mono' style='word-break:break-all'>" + esc(n.extra) + "</span></div>" : "") +
      "<details class='adv'><summary>原始 detail（含关联键，服务端已脱敏）</summary><pre class='json'>" + esc(e.detail || "—") + "</pre></details>" +
      "<div class='quotebox'>" + ico("shield") + "<span>敏感字段已隐藏：正文/秘密由服务端审计策略脱敏；本页不做编辑、删除或导出。</span></div>";
  }
  function paint() {
    var kw = ($("al-q").value || "").trim().toLowerCase();
    var rowsSrc = AUDIT_CACHE.filter(function (e) {
      if (!kw) return true;
      var n = auditNarrative(e);
      return (n.actor + " " + n.action + " " + n.object + " " + (e.kind || "") + " " + (e.detail || "")).toLowerCase().indexOf(kw) >= 0;
    });
    var rows = rowsSrc.map(function (e, i) {
      var n = auditNarrative(e);
      return "<tr class='click' data-alrow='" + i + "'><td class='mono'>" + fmtMs(e.atMs) + "</td>" +
        "<td>" + esc(n.actor) + "</td>" +
        "<td><b>" + esc(n.action) + "</b></td>" +
        "<td class='mono'>" + esc(shortIdPlain(n.object)) + "</td>" +
        "<td class='dim mono' style='max-width:220px;word-break:break-all'>" + esc(n.extra || "—") + "</td>" +
        "<td><span class='pill'>" + esc(e.kind || "—") + "</span></td></tr>";
    });
    $("al-body").innerHTML = rows.join("") || "<tr><td colspan='6' class='empty'>无匹配审计记录（筛选无结果与首次无数据是两回事——可清空筛选重试）</td></tr>";
    $("al-count").textContent = String(rowsSrc.length);
    forEach("[data-alrow]", function (tr) {
      tr.onclick = function () {
        var e = rowsSrc[parseInt(tr.getAttribute("data-alrow"), 10)];
        if (e) { AL_SEL = AUDIT_CACHE.indexOf(e); renderDetail(e); }
      };
    });
    if (AL_SEL >= 0 && AUDIT_CACHE[AL_SEL]) renderDetail(AUDIT_CACHE[AL_SEL]);
  }
  function load() {
    setState($("al-body"), "loading", 6);
    var q = "?limit=" + $("al-limit").value;
    if ($("al-kind").value.trim()) q += "&kind=" + encodeURIComponent($("al-kind").value.trim());
    api("GET", "/api/v1/admin/logs/audit" + q).then(function (j) {
      clearStale("al-stale");
      AUDIT_CACHE = j.entries || [];
      paint();
    }).catch(function (e) {
      setState($("al-body"), (e && e.timeout) ? "timeout" : "error", 6, "", errName(e));
    });
  }
  $("al-refresh").onclick = load;
  $("al-go").onclick = load;
  $("al-kind").onchange = load;
  $("al-limit").onchange = load;
  $("al-q").oninput = paint;
  load();
}

    "<ul class='expl' style='margin-top:8px'>" +
    "<li><b>版本</b>：WorkTool-Open 单文件管理台（零构建链、零外部资源）；服务端暂无版本查询端点，发布版本以仓库标签/发布说明为准。</li>" +
    "<li><b>管理员令牌</b>：仅存 SHA-256 hash（原始值签发时一次返回，库内不可还原）；怀疑泄露时在服务器以启动参数 <span class='mono'>-issue-admin-token</span> 换发新令牌（打印后退出），并另行处理旧令牌。</li>" +
    "<li><b>审批决议令牌（P0-3）</b>：决议面独立身份，服务器以 <span class='mono'>-issue-approver-token</span> 签发后交决议人在「任务 → 审批」页单独粘贴；管理令牌不能决议（403 APPROVER_SCOPE_REQUIRED），决议令牌也不能提交指令（403 ADMIN_SCOPE_REQUIRED）——双向 scope 隔离。</li>" +
    "</ul></section>" +
    "</div></div>";
  function loadSettings() {
    api("GET", "/api/v1/admin/settings").then(function (j) {
      $("g-window").value = j.guard.l1WindowSeconds;
      $("g-max").value = j.guard.l1MaxPerTx;
      $("g-deny").checked = !!j.guard.whitelistDefaultDeny;
      $("g-src").textContent = "当前来源：" + j.guard.source + "（default=管线默认 / persisted=管理面持久化值）";
      $("bk-info").innerHTML = "<span class='pill st-" + esc(j.breaker.state) + "'>" + esc(j.breaker.state) + "</span> · 窗口 " + j.breaker.windowSeconds + "s / 最少样本 " + j.breaker.minSamples + " / 失败率阈值 " + (j.breaker.threshold * 100) + "% / 冷却 " + j.breaker.cooldownSeconds + "s / 试探闭合 " + j.breaker.closeSamples + " 连成";
      setEncState(!!j.encryption.enabled);
      $("enc-note").textContent = j.encryption.note;
      $("ev-push").checked = !!j.eventCallbacks.pushEventCallback;
      $("ev-img").checked = !!j.eventCallbacks.pushImage;
      $("ev-src").textContent = "当前来源：" + j.eventCallbacks.source + "（default=上游缺省：总门开、图片关）";
      $("sv-policy").innerHTML = "白名单默认" + (j.guard.whitelistDefaultDeny ? "<span class='pill st-paused'>拒收</span>" : "<span class='pill on'>放行</span>") + " · 来源 " + esc(j.guard.source);
      $("sv-approval").textContent = "L2 动作须独立审批（决议令牌）";
      var c = j.counts || {};
      $("st-counts").textContent = "活跃令牌 " + (c.activeTokens != null ? c.activeTokens : "—") +
        " 枚 · 白名单条目 " + (c.whitelistEntries != null ? c.whitelistEntries : "—") + " 条";
      $("sv-auth").innerHTML = token ? "<span class='pill on'>已认证</span>（管理令牌）" : "<span class='pill warn'>未设置令牌</span>";
    }).catch(function () {
      $("bk-info").textContent = "设置加载失败（含熔断状态）——可刷新重试";
      $("st-counts").textContent = "设置加载失败——可刷新重试（不显示伪零值）";
    });
  }
  function saveGuard() {
    return api("PUT", "/api/v1/admin/settings/guard", {
      l1WindowSeconds: parseInt($("g-window").value, 10) || 60,
      l1MaxPerTx: parseInt($("g-max").value, 10) || 10,
      whitelistDefaultDeny: $("g-deny").checked
    });
  }
  function saveEv() {
    return api("PUT", "/api/v1/admin/settings/event-callbacks", {
      pushEventCallback: $("ev-push").checked,
      pushImage: $("ev-img").checked
    });
  }
  $("sv-save-all").onclick = function () {
    saveGuard().then(function () { return saveEv(); })
      .then(function () { okmsg("安全设置已保存并应用（限流/白名单 + 事件回调开关）"); loadSettings(); })
      .catch(function () {});
  };
  $("g-save").onclick = function () {
    saveGuard().then(function () { okmsg("限流/白名单策略已保存并应用至管线"); loadSettings(); }).catch(function () {});
  };
  $("bk-reset").onclick = function () {
    confirmBox("人工复位全局熔断器",
      "<p>确认将全局熔断器复位为 <span class='mono'>closed</span>？</p>" +
      "<p class='dim'>复位后放行请求重新计入失败率窗口；若故障源未消除将再次熔断。此操作落审计。</p>",
      "确认复位", function () {
        api("POST", "/api/v1/admin/breaker/reset", {}).then(function (j) { okmsg("熔断已复位（changed=" + j.changed + "）"); loadSettings(); }).catch(function () {});
      });
  };
  $("ev-save").onclick = function () {
    saveEv().then(function () { okmsg("事件回调开关已保存（分发内核逐事件读取，改即生效）"); loadSettings(); }).catch(function () {});
  };
  $("rk-go").onclick = function () {
    var t = $("rk-type").value.trim();
    if (!t) return;
    api("GET", "/api/v1/admin/risk/" + encodeURIComponent(t)).then(function (j) {
      $("rk-out").innerHTML = "type " + j.type + " → " + riskPill(j.riskClass);
    }).catch(function () {});
  };
  var encOn = false;
  function setEncState(on) {
    encOn = on;
    $("enc-state").innerHTML = "当前：<span class='pill " + (on ? "warn" : "unk") + "'>" + (on ? "开（保存意图）" : "关（默认）") + "</span>";
  }
  $("enc-toggle").onclick = function () {
    api("PUT", "/api/v1/admin/settings/encryption", { enabled: !encOn })
      .then(function () { okmsg("通讯加密配置已保存（强制执行边界见说明——当前版本仅保存配置意图）"); loadSettings(); }).catch(function () {});
  };
  var wlTarget = "";
  function wlRender(list) {
    $("wl-list").innerHTML = (list && list.length)
      ? list.map(function (r) { return "<span class='pill' style='margin:2px'>" + esc(r) + " <button class='mini no' data-wlrm='" + esc(r) + "'>×</button></span>"; }).join(" ")
      : "<span class='dim'>该目标未配置白名单（未配置不拦截，靠限速兜底；勾选默认拒收可收紧）</span>";
    forEach("[data-wlrm]", function (b) {
      b.onclick = function () {
        api("DELETE", "/api/v1/admin/whitelist?target=" + encodeURIComponent(wlTarget) + "&recipient=" + encodeURIComponent(b.getAttribute("data-wlrm")))
          .then(function () { okmsg("已移除"); wlLoad(); }).catch(function () {});
      };
    });
  }
  function wlLoad() {
    wlTarget = $("wl-target").value.trim();
    if (!wlTarget) { banner("先填写目标。"); return; }
    api("GET", "/api/v1/admin/whitelist?target=" + encodeURIComponent(wlTarget)).then(function (j) { wlRender(j.recipients); }).catch(function () {});
  }
  $("wl-load").onclick = wlLoad;
  $("wl-add").onclick = function () {
    wlTarget = $("wl-target").value.trim();
    var item = $("wl-item").value.trim();
    if (!wlTarget || !item) { banner("目标与接收对象均必填。"); return; }
    api("POST", "/api/v1/admin/whitelist", { target: wlTarget, recipient: item })
      .then(function () { okmsg("白名单已添加"); $("wl-item").value = ""; wlLoad(); }).catch(function () {});
  };
  loadCatalog().then(function () {
    var box = $("sv-l2");
    if (!box) return;
    box.innerHTML = CAT.ok
      ? "当前目录中的 L2 动作：" + (CAT.commands.filter(function (c) { return c.risk === "L2"; })
          .map(function (c) { return "<b>" + esc(c.name) + "</b>（" + c.type + "）"; }).join("、") || "无") +
        "。L2 提交后不直达设备：先登记待审批，由持决议令牌的独立决议人批准（批准不自动执行）。"
      : "<span style='color:var(--warn)'>目录未载——L2 清单暂不可用，请切页重试。</span>";
  });
  loadSettings();
}

/* ============ 会话（顶栏）：令牌管理（逻辑保留：localStorage + #token= 深链吸收） ============ */
function setAuthPill() {
  var el = $("auth-state");
  if (token) { el.className = "pill on"; el.textContent = "已认证"; }
  else { el.className = "pill warn"; el.textContent = "未设置令牌"; }
}
$("open-session").onclick = function () {
  openModal(
    "<h3>会话与管理令牌<button class='mini' onclick='closeModal()'>关闭</button></h3>" +
    "<p class='dim'>管理面 Bearer Token 仅保存在本浏览器 localStorage（不进 URL/日志；服务端仅存 SHA-256 hash）。修改后点「保存」以新令牌重载当前视图。</p>" +
    "<div class='row'><input id='token' type='password' placeholder='管理面 Bearer Token' autocomplete='off' size='32'>" +
    "<button id='save-token' class='primary mini'>保存</button><button id='clear-token' class='mini'>清除</button></div>" +
    "<p class='note'>401 时所有写操作被拒绝并引导回本面板；签发管理面令牌须在服务器以 <span class='mono'>-issue-admin-token</span> 启动参数完成（打印后退出）；审批决议令牌另以 <span class='mono'>-issue-approver-token</span> 签发、在「任务 → 审批」页单独保存（P0-3 分持）。清除仅移除本浏览器副本——服务端令牌撤销能力未提供时不声称「全设备已退出」。</p>", true);
  $("token").value = token;
  $("save-token").onclick = function () {
    token = $("token").value.trim();
    localStorage.setItem(TOKEN_KEY, token);
    setAuthPill();
    closeModal();
    okmsg("令牌已保存——正在以新令牌重载当前视图");
    route();
  };
  $("clear-token").onclick = function () {
    token = ""; localStorage.removeItem(TOKEN_KEY);
    $("token").value = "";
    setAuthPill();
    okmsg("已清除本浏览器保存的令牌");
  };
  setAuthPill();
};

/* ============ 启动 ============ */
setInterval(function () {
  var el = $("sync-time");
  if (!el) return;
  el.textContent = window.__lastSync
    ? "数据更新于 " + new Date(window.__lastSync).toISOString().replace("T", " ").slice(0, 19) + " UTC"
    : "尚未加载数据";
}, 1000);
var footDate = $("foot-date");
if (footDate) footDate.textContent = new Date().toISOString().slice(0, 10);
setAuthPill();
route();
</script>
</body>
</html>
