<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WorkTool-Open 管理台</title>
<style>
  /* 深色主题（#1e1e2e 底）· 单文件内嵌 CSS · 零外部资源（无 CDN/字体/图片，G3/G4 纪律） */
  :root {
    --bg:#1e1e2e; --panel:#262637; --panel2:#2d2d44; --line:#3b3b55; --fg:#e6e6f0;
    --dim:#9494b0; --acc:#89b4fa; --ok:#a6da95; --warn:#eed49f; --err:#ed8796;
    --mono:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.65 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  /* ---- 布局：左导航 + 右内容 + 顶栏 ---- */
  #app { display:grid; grid-template-columns:216px 1fr; grid-template-rows:52px 1fr;
         grid-template-areas:"brand topbar" "nav content"; height:100vh; }
  #brand { grid-area:brand; display:flex; align-items:center; gap:8px; padding:0 14px;
           background:var(--panel); border-right:1px solid var(--line); font-weight:700; }
  #brand .logo { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,var(--acc),#b48ead);
                 display:inline-flex; align-items:center; justify-content:center; font-size:12px; color:#1e1e2e; }
  #brand small { display:block; color:var(--dim); font-weight:400; font-size:10px; }
  #topbar { grid-area:topbar; display:flex; align-items:center; justify-content:space-between;
            gap:12px; padding:0 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  #crumbs { color:var(--dim); font-size:13px; }
  #crumbs b { color:var(--fg); font-weight:600; }
  #authbar { display:flex; gap:6px; align-items:center; }
  #authbar input { width:230px; }
  #nav { grid-area:nav; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line);
         padding:10px 0 30px; }
  #nav .group { margin:14px 0 4px; padding:0 16px; font-size:11px; color:var(--dim);
                letter-spacing:1px; text-transform:uppercase; }
  #nav a { display:flex; align-items:center; gap:9px; padding:7px 16px; color:var(--fg);
           text-decoration:none; font-size:13.5px; border-left:3px solid transparent; }
  #nav a .ic { width:18px; text-align:center; font-size:14px; }
  #nav a:hover { background:var(--panel2); }
  #nav a.active { background:var(--panel2); border-left-color:var(--acc); color:var(--acc); }
  #content { grid-area:content; overflow-y:auto; padding:18px 22px 60px; }
  #content a { color:var(--acc); }
  /* ---- 通用元件 ---- */
  h2.view { margin:0 0 4px; font-size:17px; }
  .sub { color:var(--dim); font-size:12.5px; margin:0 0 14px; }
  section.card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
                 padding:14px 16px; margin:0 0 16px; }
  section.card > h3 { margin:0 0 10px; font-size:13.5px; color:var(--acc); }
  section.card > h3 .hint { color:var(--dim); font-weight:400; font-size:11.5px; margin-left:8px; }
  section.card > h3.mono { font-family:var(--mono); }
  input, select, textarea, button { background:#191927; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:5px 10px; font:inherit; }
  textarea { font-family:var(--mono); font-size:12.5px; width:100%; }
  button { cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#1e1e2e; font-weight:600; }
  button.ok { background:transparent; border-color:var(--ok); color:var(--ok); }
  button.no { background:transparent; border-color:var(--err); color:var(--err); }
  button.warn { background:transparent; border-color:var(--warn); color:var(--warn); }
  button.mini { padding:2px 8px; font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .row label { display:flex; gap:5px; align-items:center; font-size:13px; color:var(--dim); }
  table { width:100%; border-collapse:collapse; font-size:12.8px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; white-space:nowrap; }
  td.mono, .mono { font-family:var(--mono); font-size:12px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11.5px;
          border:1px solid var(--line); white-space:nowrap; }
  .pill.on, .pill.st-delivered, .pill.st-succeeded, .pill.st-active { color:var(--ok); border-color:var(--ok); }
  .pill.off, .pill.st-dead, .pill.st-failed, .pill.st-revoked, .pill.st-paused,
  .pill.st-expired, .pill.st-rejected, .pill.st-cancelled { color:var(--err); border-color:var(--err); }
  .pill.st-pending, .pill.warn, .pill.dry, .pill.st-awaiting_approval { color:var(--warn); border-color:var(--warn); }
  .pill.L2 { color:var(--err); border-color:var(--err); }
  .pill.L1 { color:var(--warn); border-color:var(--warn); }
  .pill.L0 { color:var(--dim); }
  .pill.st-queued, .pill.st-dispatched, .pill.st-acked, .pill.st-running { color:var(--acc); border-color:var(--acc); }
  .pill.st-skipped { color:var(--dim); }
  .pill.edge { color:var(--acc); border-color:var(--acc); font-family:var(--mono); }
  .pill.edge.term { color:var(--warn); border-color:var(--warn); }
  .pill.edge.unk { color:var(--err); border-color:var(--err); }
  .pill.cb1 { color:var(--acc); border-color:var(--acc); }
  .pill.cb11 { color:var(--ok); border-color:var(--ok); }
  .dim { color:var(--dim); }
  .empty { color:var(--dim); padding:10px 0; }
  #banner { background:#3a1a24; border:1px solid var(--err); color:#ffc4ce; border-radius:8px;
            padding:8px 12px; margin:0 0 12px; display:none; }
  #okmsg { background:#20323a; border:1px solid var(--ok); color:#c7e8d4; border-radius:8px;
           padding:8px 12px; margin:0 0 12px; display:none; }
  pre.json { background:#191927; border:1px solid var(--line); border-radius:8px; padding:10px 12px;
             font-family:var(--mono); font-size:12px; overflow-x:auto; margin:8px 0; white-space:pre-wrap; word-break:break-all; }
  /* 概览指标卡 */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat .k { color:var(--dim); font-size:12px; }
  .stat .v { font-size:24px; font-weight:700; font-family:var(--mono); margin-top:2px; }
  .stat .v small { font-size:12px; color:var(--dim); font-weight:400; }
  .stat.ok .v { color:var(--ok); } .stat.err .v { color:var(--err); } .stat.acc .v { color:var(--acc); }
  /* 执行日志时间线 */
  .tl { border-left:2px solid var(--line); margin:8px 0 4px 6px; padding-left:16px; }
  .tl .item { position:relative; padding:4px 0 10px; }
  .tl .item::before { content:""; position:absolute; left:-21px; top:10px; width:8px; height:8px;
                      border-radius:50%; background:var(--acc); }
  .tl .item.term::before { background:var(--warn); }
  .tl .item.unk::before { background:var(--err); }
  .tl .head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tl .meta { color:var(--dim); font-size:12px; }
  .tl .detail { font-family:var(--mono); font-size:11.5px; color:var(--dim); word-break:break-all; }
  /* 弹层（指令详情/危险确认） */
  #modal { position:fixed; inset:0; background:rgba(20,20,31,.72); display:none;
           align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto; }
  #modal .box { background:var(--panel); border:1px solid var(--line); border-radius:12px;
                max-width:960px; width:100%; padding:16px 18px; }
  #modal .box h3 { margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  /* 配对码 */
  #code-result { display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  #code-big { font:700 34px/1 var(--mono); letter-spacing:8px; color:var(--ok);
              background:#191927; border:1px dashed var(--ok); border-radius:8px; padding:12px 18px; }
  .note { font-size:12px; color:var(--dim); margin-top:6px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:980px){ #app{ grid-template-columns:64px 1fr; } #nav a span.txt,#nav .group,#brand small{ display:none; } .grid2{ grid-template-columns:1fr; } }
  /* 三步引导（指令发送） */
  .steps { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
  .steps span { padding:3px 10px; border-radius:12px; border:1px solid var(--line); color:var(--dim); font-size:12px; }
  .steps span b { color:var(--acc); font-weight:600; }
  .pickbox { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .warnbox { background:#3a3222; border:1px solid var(--warn); color:var(--warn); border-radius:8px;
             padding:8px 12px; margin:8px 0; font-size:12.8px; }
  .warnbox a { color:var(--warn); }
  .oknote { background:#20323a; border:1px solid var(--ok); color:#c7e8d4; border-radius:8px;
            padding:8px 12px; margin:8px 0; font-size:12.8px; }
  label.param { display:block; margin:8px 0 2px; color:var(--dim); font-size:13px; }
  label.param input, label.param textarea { margin-top:3px; color:var(--fg); }
  /* 说明块 / 错误码行 */
  ul.expl { margin:4px 0 2px; padding-left:18px; color:var(--dim); font-size:12.6px; }
  ul.expl li { margin:4px 0; }
  ul.expl b { color:var(--fg); }
  .errline { color:var(--err); font-family:var(--mono); font-size:12px; margin-top:2px; }
</style>
</head>
<body>
<div id="app">
  <div id="brand"><span class="logo">WT</span><span>WorkTool-Open<small>管理台 · 单文件 · 零构建链</small></span></div>
  <div id="topbar">
    <div id="crumbs">管理台 / <b id="crumb-view">概览</b></div>
    <div id="authbar">
      <input id="token" type="password" placeholder="管理面 Bearer Token" autocomplete="off">
      <button id="save-token" class="primary mini">保存</button>
      <button id="clear-token" class="mini">清除</button>
    </div>
  </div>
  <nav id="nav">
    <div class="group">总览</div>
    <a href="#/dashboard" data-route="dashboard"><span class="ic">📊</span><span class="txt">概览 Dashboard</span></a>
    <div class="group">设备</div>
    <a href="#/devices" data-route="devices"><span class="ic">📱</span><span class="txt">设备管理</span></a>
    <div class="group">指令</div>
    <a href="#/send" data-route="send"><span class="ic">📨</span><span class="txt">指令发送</span></a>
    <a href="#/commands" data-route="commands"><span class="ic">🗒️</span><span class="txt">指令历史</span></a>
    <a href="#/queue" data-route="queue"><span class="ic">🧾</span><span class="txt">队列视图</span></a>
    <a href="#/approvals" data-route="approvals"><span class="ic">✅</span><span class="txt">L2 审批</span></a>
    <div class="group">回调</div>
    <a href="#/callbacks" data-route="callbacks"><span class="ic">🔔</span><span class="txt">回调配置</span></a>
    <a href="#/callback-logs" data-route="callback-logs"><span class="ic">📡</span><span class="txt">回调日志</span></a>
    <div class="group">日志</div>
    <a href="#/logs-exec" data-route="logs-exec"><span class="ic">🧭</span><span class="txt">指令执行日志</span></a>
    <a href="#/logs-audit" data-route="logs-audit"><span class="ic">📜</span><span class="txt">系统审计日志</span></a>
    <div class="group">系统</div>
    <a href="#/settings" data-route="settings"><span class="ic">⚙️</span><span class="txt">设置</span></a>
  </nav>
  <main id="content">
    <div id="banner"></div>
    <div id="okmsg"></div>
    <div id="view"></div>
    <div class="note" id="foot">
      数据全部来自本服务（无第三方资源/字体/统计）· 指令正文仅在详情面展示（列表仅元数据）·
      令牌仅存 SHA-256 hash（原始值一次返回）· TLS 部署下使用（SR-01/09）。
    </div>
  </main>
</div>
<div id="modal"><div class="box" id="modal-box"></div></div>

<script>
"use strict";
/* ============ 基础设施 ============ */
var TOKEN_KEY = "wt_admin_token", APPROVER_KEY = "wt_admin_approver";
var token = localStorage.getItem(TOKEN_KEY) || "";
// #token= 深链吸收（吸收后立即抹除，防随链接二次泄露）；其余 hash 一律视为路由。
(function absorbToken() {
  var m = location.hash.match(/^#token=(.+)$/);
  if (m) {
    token = decodeURIComponent(m[1]);
    localStorage.setItem(TOKEN_KEY, token);
    history.replaceState(null, "", location.pathname + location.search);
  }
})();
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtMs(ms) {
  if (!ms) return "—";
  return new Date(ms).toISOString().replace("T", " ").replace(".000Z", "Z");
}
function banner(msg) { var b = $("banner"); b.textContent = msg || ""; b.style.display = msg ? "block" : "none"; }
function okmsg(msg) { var b = $("okmsg"); b.textContent = msg || ""; b.style.display = msg ? "block" : "none"; }
function api(method, path, body) {
  var opt = { method: method, headers: { "Authorization": "Bearer " + token } };
  if (body !== undefined) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  return fetch(path, opt).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (r.status === 401) { banner("鉴权失败（401）：请检查管理面 Token 后点「保存」。"); throw new Error("401"); }
      if (!r.ok) { banner("请求失败（" + r.status + " " + (j.error || "") + "）：" + (j.message || r.statusText)); throw new Error(String(r.status)); }
      banner(""); return j;
    });
  });
}
function openModal(html) { $("modal-box").innerHTML = html; $("modal").style.display = "flex"; }
function closeModal() { $("modal").style.display = "none"; $("modal-box").innerHTML = ""; }
$("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeModal(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
// confirmBox：弹层式二次确认（危险操作防误触；比原生 confirm 可承载完整提示文案）
function confirmBox(title, bodyHtml, okLabel, onOk) {
  openModal("<h3>" + title + "<button class='mini' onclick='closeModal()'>关闭</button></h3>" + bodyHtml +
    "<div class='row'><button id='modal-ok' class='no'>" + esc(okLabel || "确认") + "</button>" +
    "<button class='mini' onclick='closeModal()'>取消</button></div>");
  $("modal-ok").onclick = function () { closeModal(); onOk(); };
}

/* ============ 指令目录（数据源：GET /api/v1/admin/catalog；拉取失败时回退
 * server/internal/api/openapi_registry.go 同步维护的内置静态表）============
 * 服务端口径：commands[]（type/name/risk/required/example/group）+ statusLegend +
 * riskLegend。历史/队列/执行日志页枚举化显示与发送页三步引导均以此为准。 */
var CAT = { commands: [], byType: {}, statusLegend: {}, riskLegend: {}, ok: false };
var CAT_PROMISE = null;
function loadCatalog() {
  if (CAT_PROMISE) return CAT_PROMISE;
  CAT_PROMISE = api("GET", "/api/v1/admin/catalog").then(function (j) {
    CAT.commands = j.commands || [];
    CAT.byType = {};
    CAT.commands.forEach(function (c) { CAT.byType[c.type] = c; });
    CAT.statusLegend = j.statusLegend || {};
    CAT.riskLegend = j.riskLegend || {};
    CAT.ok = true;
    return CAT;
  }).catch(function () {
    CAT.ok = false; // 回退：纯数字显示（列表页）+ 内置静态表（发送页）
    return CAT;
  });
  return CAT_PROMISE;
}
// 兜底静态表（仅发送页在 catalog 端点不可达时使用；展示口径以服务端为准）
var RISK = {
  L1: [206, 207, 213, 220, 227, 228, 229, 230],
  L2: [219, 234, 304]
};
var CATALOG = [
  { t: 201, n: "停止并回家", p: [] },
  { t: 202, n: "循环接收新消息", p: [] },
  { t: 203, n: "发送文本消息", p: ["targetRoom", "receivedContent"] },
  { t: 204, n: "回复消息", p: ["targetRoom", "receivedContent"] },
  { t: 205, n: "转发消息", p: ["targetRoom", "receivedName"] },
  { t: 206, n: "建群", p: ["groupName"] },
  { t: 207, n: "改群配置", p: ["targetRoom"] },
  { t: 212, n: "通过全部好友申请", p: [] },
  { t: 213, n: "手机号加好友", p: ["receivedName"] },
  { t: 214, n: "查看群信息", p: ["targetRoom"] },
  { t: 218, n: "发送文件", p: ["targetRoom", "receivedName"] },
  { t: 219, n: "解散群", p: ["targetRoom"] },
  { t: 220, n: "群内加好友", p: ["receivedName"] },
  { t: 224, n: "发送链接", p: ["targetRoom", "receivedContent"] },
  { t: 226, n: "撤回消息", p: ["targetRoom", "receivedContent"] },
  { t: 229, n: "批量发送", p: ["targetRoom"] },
  { t: 233, n: "扫描二维码", p: [] },
  { t: 234, n: "删除联系人", p: ["receivedName"] },
  { t: 237, n: "清理企微缓存", p: [] },
  { t: 238, n: "批量发文本", p: ["targetRoom"] },
  { t: 244, n: "退出群", p: ["targetRoom"] },
  { t: 303, n: "机器人控制器测试", p: [] },
  { t: 304, n: "清空指令队列", p: [] },
  { t: 501, n: "查群信息", p: ["targetRoom"] },
  { t: 503, n: "查我的信息", p: [] },
  { t: 505, n: "查最近会话", p: [] },
  { t: 506, n: "查企业列表", p: ["receivedContent"] },
  { t: 507, n: "查全部好友", p: [] },
  { t: 508, n: "查全部群聊", p: [] }
];
function riskOf(t) {
  if (RISK.L2.indexOf(t) >= 0) return "L2";
  if (RISK.L1.indexOf(t) >= 0) return "L1";
  var known = CATALOG.some(function (c) { return c.t === t; });
  return known ? "L0" : "L2"; // 未登记类型按 L2 fail-closed（FR-53 裁决②）
}
function catByType(t) {
  for (var i = 0; i < CATALOG.length; i++) if (CATALOG[i].t === t) return CATALOG[i];
  return null;
}
// 列表页「中文名 (203)」双显示；目录未命中/未载时回退纯数字
function typeCell(t) {
  var e = CAT.byType[t];
  return e ? esc(e.name) + " <span class='dim mono'>(" + t + ")</span>" : "<span class='mono'>" + t + "</span>";
}
// 时间线/徽标形态的类型显示（带风险色）
function typePill(t, risk) {
  var e = CAT.byType[t];
  var rc = risk || (e ? e.risk : "");
  return "<span class='pill " + esc(rc) + "'>" + (e ? esc(e.name) + " (" + t + ")" : "type " + t) + "</span>";
}
function catNote() {
  return CAT.ok
    ? "指令目录已加载（" + CAT.commands.length + " 条），类型显示为「中文名 (编号)」"
    : "<span style='color:var(--warn)'>指令目录拉取失败：type 回退纯数字显示</span>";
}
/* 状态中文化：statusLegend（服务端目录）优先，本地 STNAME 兜底（覆盖
 * acked/running/cancelled 等目录未含的机内状态） */
var STATES = ["", "queued", "dispatched", "acked", "running", "succeeded", "failed", "cancelled", "execution_unknown", "awaiting_approval"];
var STNAME = { queued: "排队", dispatched: "已下发", acked: "已确认", running: "执行中", succeeded: "成功", failed: "失败",
  cancelled: "已取消", execution_unknown: "结果未知", awaiting_approval: "待审批（L2）", expired: "超期", rejected: "拒收" };
function stName(st) { return CAT.statusLegend[st] || STNAME[st] || st; }
function stPill(st) { return "<span class='pill st-" + esc(st) + "'>" + esc(stName(st)) + "</span>"; }
function riskPill(rc) {
  var tip = CAT.riskLegend[rc] || "";
  return "<span class='pill " + esc(rc) + "'" + (tip ? " title='" + esc(tip) + "'" : "") + ">" + esc(rc) + "</span>";
}

/* ============ ③a 指令发送（三步引导：① 选指令 → ② 填参数/载荷预览 → ③ 干跑预览/正式发送） ============ */
function renderSend() {
  $("view").innerHTML =
    "<h2 class='view'>指令发送</h2><p class='sub'>POST /api/v1/admin/commands · 与兼容面同一条统一管线（scheduler.Submit：幂等/熔断/审批/白名单/限速/风险冻结全链生效）</p>" +
    "<div class='steps'><span><b>①</b> 选择指令（目录分组）</span><span><b>②</b> 填写参数 · 载荷预览</span><span><b>③</b> 干跑预览 → 正式发送</span></div>" +
    "<section class='card'><h3>第 1 步 · 选择指令 <span class='hint'>GET /api/v1/admin/catalog · 按 group 分组 · 悬停风险徽标见分级说明</span></h3>" +
    "<div class='row'><label>指令 <select id='send-type'><option value=''>目录加载中…</option></select></label>" +
    "<span class='dim' id='send-cat-note'></span></div>" +
    "<div id='send-pick'></div></section>" +
    "<section class='card'><h3>第 2 步 · 参数与载荷预览 <span class='hint'>必填参数按目录 required 生成；数组参数一行一个；预览可手动微调，提交以预览为准</span></h3>" +
    "<div class='row'><label>目标 target <input id='send-target' placeholder='deviceId 或 v1:robotId' size='26'></label>" +
    "<label>提交人 actor <input id='send-actor' placeholder='默认 admin' size='12'></label>" +
    "<label>审批号 approvalId（L2 决议后回填） <input id='send-approval' placeholder='可选' size='30'></label></div>" +
    "<div id='send-fields'></div>" +
    "<label class='param'>载荷预览（实时拼装，可手动微调）<textarea id='send-json' rows='8'>{}</textarea></label>" +
    "<div class='row'><button id='send-regen' class='mini'>按表单重新生成预览</button><span class='dim' id='send-manual'></span></div></section>" +
    "<section class='card'><h3>第 3 步 · 预览与发送</h3>" +
    "<div class='row'><label><input type='checkbox' id='send-dry' checked> 干跑模式（默认开）</label>" +
    "<span class='dim'>干跑 = 同引擎只产出计划、零副作用；验参无误后取消勾选，再点「正式发送」。</span></div>" +
    "<div class='row'><button id='send-dryrun' class='primary'>干跑预览</button>" +
    "<button id='send-go'>正式发送</button><span id='send-risk-hint' class='dim'></span></div>" +
    "<div id='send-warn'></div><div id='send-result'></div>" +
    "<p class='note'>正式发送防误发：需先取消「干跑模式」勾选；L2 指令另有弹层警示与独立审批门。未知类型按 L2 fail-closed（FR-53 裁决②）。分级实时口径可到「设置 → 分级查询」验证。</p></section>";
  var manual = false; // 预览手动微调标记：改动后不再被表单输入覆盖，直到点「重新生成」或改参数
  // 兜底目录：catalog 端点不可达时用内置静态表（标注可能过期）
  function localCatalog() {
    return CATALOG.map(function (c) {
      return { type: c.t, name: c.n, risk: riskOf(c.t), required: c.p || [], group: "内置静态目录（回退）", example: "" };
    });
  }
  function buildTypeOptions(list) {
    var groups = [], byGroup = {};
    list.forEach(function (c) {
      var g = c.group || "未分组";
      if (!byGroup[g]) { byGroup[g] = []; groups.push(g); }
      byGroup[g].push(c);
    });
    $("send-type").innerHTML = groups.map(function (g) {
      return "<optgroup label='" + esc(g) + "'>" + byGroup[g].map(function (c) {
        return "<option value='" + c.type + "'>" + c.type + " · " + esc(c.name) + "（" + esc(c.risk) + "）</option>";
      }).join("") + "</optgroup>";
    }).join("");
  }
  function currentEntry() {
    var t = parseInt($("send-type").value, 10);
    if (!t) return null;
    if (CAT.byType[t]) return CAT.byType[t];
    var loc = catByType(t);
    return loc ? { type: loc.t, name: loc.n, risk: riskOf(loc.t), required: loc.p || [], group: "", example: "" } : null;
  }
  // 从示例载荷取参数类型提示（数组 → 多行文本；其余单行）
  function exampleValue(entry, key) {
    if (!entry || !entry.example) return undefined;
    var v;
    try { v = JSON.parse(entry.example); } catch (e) { return undefined; }
    var parts = String(key).split(".");
    for (var i = 0; i < parts.length; i++) {
      if (v == null || typeof v !== "object") return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function buildFields(entry) {
    var req = (entry && entry.required) || [];
    if (!req.length) {
      $("send-fields").innerHTML = "<p class='dim' style='margin:6px 0'>该指令无必填参数：载荷仅含 type；可选参数可在下方「载荷预览」手动补充。</p>";
      return;
    }
    $("send-fields").innerHTML = req.map(function (k) {
      var v = exampleValue(entry, k);
      if (Array.isArray(v)) {
        return "<label class='param'>" + esc(k) + "（数组，每行一个）<textarea data-param='" + esc(k) + "' data-kind='array' rows='3' placeholder='" + esc(v.join("\n")) + "'></textarea></label>";
      }
      var ph = v == null ? "" : String(v);
      return "<label class='param'>" + esc(k) + " <input data-param='" + esc(k) + "' data-kind='text' size='24' placeholder='" + esc(ph) + "'></label>";
    }).join("");
    forEach("#send-fields [data-param]", function (el) {
      el.addEventListener("input", function () {
        manual = false; $("send-manual").textContent = "";
        regen();
      });
    });
  }
  function regen() {
    var entry = currentEntry();
    var payload = {};
    if (entry) payload.type = entry.type;
    forEach("#send-fields [data-param]", function (el) {
      var k = el.getAttribute("data-param"), kind = el.getAttribute("data-kind");
      if (kind === "array") {
        var lines = el.value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(function (s) { return s !== ""; });
        if (lines.length) payload[k] = lines;
      } else if (el.value.trim() !== "") {
        if (k.indexOf(".") > 0) { // 嵌套参数平铺：friend.phone → payload.friend.phone
          var parts = k.split("."), node = payload;
          for (var i = 0; i < parts.length - 1; i++) {
            if (typeof node[parts[i]] !== "object" || node[parts[i]] === null) node[parts[i]] = {};
            node = node[parts[i]];
          }
          node[parts[parts.length - 1]] = el.value.trim();
        } else payload[k] = el.value.trim();
      }
    });
    $("send-json").value = JSON.stringify(payload, null, 2);
  }
  function onPick() {
    var entry = currentEntry();
    if (!entry) return;
    $("send-pick").innerHTML =
      "<div class='pickbox'><div class='row' style='margin:0'>" +
      "<b style='font-size:15px'>" + esc(entry.name) + "</b>" + riskPill(entry.risk) +
      "<span class='dim mono'>type " + entry.type + "</span>" +
      (entry.group ? "<span class='pill'>" + esc(entry.group) + "</span>" : "") + "</div>" +
      "<div class='dim' style='margin:6px 0'>场景：" + esc(entry.name) + "。</div>" +
      "<div class='dim' id='send-risk-line'>" + (CAT.riskLegend[entry.risk] ? "分级：" + esc(CAT.riskLegend[entry.risk]) : "") + "</div>" +
      "<div>必填参数：" + ((entry.required || []).length
        ? entry.required.map(function (k) { return "<span class='pill mono'>" + esc(k) + "</span>"; }).join(" ")
        : "<span class='dim'>无</span>") + "</div>" +
      (entry.example ? "<div class='dim' style='margin:6px 0 0'>示例载荷：</div><pre class='json' style='margin:4px 0 0'>" + esc(prettyJSON(entry.example)) + "</pre>" : "") +

    $("send-warn").innerHTML = entry.risk === "L2"
      ? "<div class='warnbox'>L2 高风险指令：正式发送<b>不会直达设备</b>——提交后进入「待审批」状态，须经独立决议人在 <a href='#/approvals'>L2 审批</a> 页批准，再携审批号回到本页重新提交方可下发。</div>"
      : "";
    $("send-risk-hint").innerHTML = "将提交：" + esc(entry.name) + " · type " + entry.type + " " + riskPill(entry.risk);
    buildFields(entry);

  }
  $("send-type").onchange = onPick;
  $("send-json").addEventListener("input", function () {
    manual = true;
    $("send-manual").textContent = "已手动微调：提交以预览框内容为准（改动参数表单或点「重新生成」会覆盖手动修改）。";
  });
  $("send-regen").onclick = function () { manual = false; $("send-manual").textContent = ""; regen(); };
  function missingRequired(entry, payload) {
    return ((entry && entry.required) || []).filter(function (k) {
      var v = payload, parts = String(k).split(".");
      for (var i = 0; i < parts.length; i++) {
        if (v == null || typeof v !== "object") return true;
        v = v[parts[i]];
      }
      return v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length);
    });
  }
  function renderResult(j, dry) {
    if (j.state === "awaiting_approval") {
      $("send-result").innerHTML = "<div class='warnbox'>已登记<b>待审批</b>（L2 高风险，FR-53）：审批号 <span class='mono'>" + esc(j.approvalId) + "</span><br>" +
        "提交后不直达设备；到 <a href='#/approvals'>L2 审批</a> 页由独立决议人批准/拒绝。批准后回到本页在「审批号」一栏回填该 approvalId 重新提交即可下发。</div>";
      okmsg("L2 指令待审批：" + esc(j.approvalId));

    }
    var html = "<div class='oknote'>已受理：commandId <span class='mono'>" + esc(j.commandId) + "</span> 状态 " + stPill(j.state) +
      (j.replay ? "（幂等重放）" : "") + " · <a href='#/commands'>去历史页查看</a>";
    if (dry && j.dryRunReport !== undefined && j.dryRunReport !== null) {
      html += "<div class='dim' style='margin-top:6px'>干跑报告（同引擎产出计划，零副作用）：</div><pre class='json' style='margin:4px 0 0'>" + esc(prettyJSON(j.dryRunReport)) + "</pre>";
    }
    html += "</div>";

  }
  function doSend(dry) {
    var entry = currentEntry();
    if (!entry) { banner("请先在第 1 步选择指令。"); return; }
    var target = $("send-target").value.trim();
    if (!target) { banner("target 必填（deviceId 或 v1:robotId）。"); return; }
    var payload;
    try { payload = JSON.parse($("send-json").value || "{}"); }
    catch (e) { banner("载荷预览 JSON 解析失败：" + e.message); return; }
    if (payload === null || typeof payload !== "object" || Array.isArray(payload)) {
      banner("载荷须为 JSON 对象（如 {} 或 {\"titleList\":[\"群名\"]}）。"); return;
    }
    if (payload.type === undefined) payload.type = entry.type; // CR ADM-2：type 自动注入
    var missing = missingRequired(entry, payload);
    if (missing.length && !confirm("以下必填参数未填写：" + missing.join("、") + "\n仍要提交？（服务端静态校验可能拒绝）")) return;
    var body = { target: target, type: entry.type, payload: payload, dryRun: dry, actor: $("send-actor").value.trim() || "admin" };
    if ($("send-approval").value.trim()) body.approvalId = $("send-approval").value.trim();
    body.idempotencyKey = sendIdemKey(); // CR ADM-4：本次提交的幂等键（失败重试复用，成功后轮换）
    var b1 = $("send-dryrun"), b2 = $("send-go");

      renderResult(j, dry);
    }).catch(function () {

    }).then(function () { b1.disabled = false; b2.disabled = false; });
  }
  $("send-dryrun").onclick = function () { doSend(true); };
  $("send-go").onclick = function () {
    if ($("send-dry").checked) {
      banner("防误发保护：「干跑模式」仍处于勾选状态——请先核验干跑报告，取消勾选后再点「正式发送」。");
      return;
    }
    var entry = currentEntry();
    if (entry && entry.risk === "L2") {
      confirmBox("正式发送 L2 高风险指令",
        "<p>即将正式发送 <b>" + esc(entry.name) + "</b>（type " + entry.type + "，风险 <span class='pill L2'>L2</span>）。</p>" +
        "<p class='dim'>L2 指令需独立审批：提交后不直达设备，先进入「待审批」状态；须经与申请人不同的决议人在「L2 审批」页批准，携审批号重新提交后方才下发。</p>",
        "确认提交", function () { doSend(false); });
      return;
    }
    doSend(false);
  };
  loadCatalog().then(function () {
    if (CAT.ok) {
      buildTypeOptions(CAT.commands);
    } else {
      buildTypeOptions(localCatalog());
      $("send-cat-note").innerHTML = "<span style='color:var(--warn)'>目录端点拉取失败：已回退内置静态表（名称/必填参数可能过期，以服务端校验为准）</span>";
    }
    onPick();
  });
}
// CR ADM-4：提交幂等键管理（受理成功轮换 / 失败保留复用）
var SEND_IDEM_KEY = null;
function uuid4() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  // 非安全上下文兜底（http://IP 部署）：时间戳+随机数拼 36 位 UUID 形态
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (ch) {
    var r = Math.random() * 16 | 0;
    return (ch === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
function sendIdemKey() { if (!SEND_IDEM_KEY) SEND_IDEM_KEY = uuid4(); return SEND_IDEM_KEY; }
function sendIdemDone() { SEND_IDEM_KEY = null; }

      "批准后回到「指令发送」页携审批号重新提交，方才进入下发管线。";
  }
  function decide(id, decision) {
    var approver = $("approver").value.trim();
    if (!approver) { banner("请先填写决议人（approver）；与申请人相同会被自批拒绝（403）。"); return; }
    var inp = document.querySelector("input[data-reason='" + id + "']");
    var reason = inp ? inp.value.trim() : "";
    api("POST", "/api/v1/admin/approvals/" + encodeURIComponent(id) + "/decision",
      { approver: approver, decision: decision, reason: reason })
      .then(function () {
        okmsg("决议完成（" + (decision === "approve" ? "已批准" : "已拒绝") + "）：" + id +
          (decision === "approve" ? " · 请申请人携审批号重新提交" : ""));
        load();
      }).catch(function () {});
  }
  function load() {
    loadCatalog().then(function () {
      fillExpl();
      api("GET", "/api/v1/admin/approvals?status=" + $("ap-status").value).then(function (j) {
        var rows = (j.approvals || []).map(function (a) {
          var act = a.status === "pending"
            ? "<input data-reason='" + esc(a.approvalId) + "' placeholder='reason（拒绝原因）' size='14'> " +
              "<button class='ok mini' data-approve='" + esc(a.approvalId) + "'>批准</button> " +
              "<button class='no mini' data-reject='" + esc(a.approvalId) + "'>拒绝</button>"
            : "<span class='dim'>" + esc(a.approver || "—") + (a.decidedAtMs ? " · " + fmtMs(a.decidedAtMs) : "") + "</span>";
          return "<tr><td>" + shortId(a.approvalId) + "</td><td>" + esc(a.actor) + "</td>" +
            "<td class='mono'>" + esc(a.target) + "</td><td>" + typeCell(a.type) + (a.recurring ? " <span class='pill warn'>常设</span>" : "") + "</td>" +
            "<td>" + riskPill(a.riskClass) + "</td><td>" + esc(a.reason || "—") + "</td>" +
            "<td class='mono'>" + fmtMs(a.createdAtMs) + "</td><td>" + act + "</td></tr>";
        });
        $("approvals-body").innerHTML = rows.join("") || "<tr><td colspan='8' class='empty'>无该状态审批</td></tr>";
        forEach("[data-approve]", function (b) { b.onclick = function () { decide(b.getAttribute("data-approve"), "approve"); }; });
        forEach("[data-reject]", function (b) { b.onclick = function () { decide(b.getAttribute("data-reject"), "reject"); }; });
      }).catch(function () {});
    });
  }
  $("refresh-approvals").onclick = load;
  $("ap-status").onchange = load;
  load();
}

function cbTypePill(t) {

function renderCallbacks() {
  $("view").innerHTML =
    "<h2 class='view'>回调配置</h2><p class='sub'>/api/v1/admin/callbacks · 与兼容面同源表 openapi_callbacks（每 robot 同一 type 至多一条，不同 type 可并存多条）· 绑定校验：目标须以 200 + application/json 应答（3s）· 默认仅 loopback（SR-09）</p>" +

    "<ul class='expl'>" +
    "<li><b>type 1 · 指令结果回调</b>：指令到达终态（成功/失败/取消等）时推送终态回执；按提交目标对应的 robot 寻址其 type=1 绑定 URL。</li>" +
    "<li><b>type 11 · 消息与查询推送回调</b>：被动消息上报与查询类推送（511 查询会议 / 512 群成员 / 513 设备资源 / 514 日志片段 / 515 群名）。</li>" +
    "<li><b>未配置对应类型</b>：该类事件不外呼推送，仅留库（outbox 投递行落终态 skipped，可在「回调日志」对账）。</li>" +
    "<li><b>其余枚举</b>：type 0 群二维码回调、type 5 上线回调、type 6 下线回调（兼容面同源枚举，可一并绑定）。</li>" +
    "<li>绑定即启用、删除即停用（表无独立 enabled 列）；接收器默认仅允许 loopback，外网须部署侧放行并强制 TLS（SR-01/09）。</li>" +
    "</ul></section>" +
    "<div id='cb-groups'><div class='empty'>尚未加载</div></div>" +
    "<section class='card'><h3>添加绑定 <span class='hint'>POST 新增/覆盖 · PUT 仅更新既有绑定</span></h3>" +
    "<div class='row'><label>robot <input id='cb-robot' list='cb-robots' size='18' placeholder='选择或输入 robotId'><datalist id='cb-robots'></datalist></label>" +
    "<span class='dim'>候选来自设备列表的 robot 绑定与既有回调绑定。</span></div>" +
    "<div class='row'>" +
    "<label><input type='radio' name='cb-type' value='1' checked> 1 · 指令结果回调</label>" +
    "<label><input type='radio' name='cb-type' value='11'> 11 · 消息与查询推送</label>" +
    "<label><input type='radio' name='cb-type' value='0'> 0 · 群二维码</label>" +
    "<label><input type='radio' name='cb-type' value='5'> 5 · 上线</label>" +
    "<label><input type='radio' name='cb-type' value='6'> 6 · 下线</label></div>" +
    "<p class='note' id='cb-radio-desc'></p>" +
    "<div class='row'><label>callBackUrl <input id='cb-url' placeholder='http://127.0.0.1:…/cb' size='40'></label>" +
    "<button id='cb-add' class='primary mini'>保存（POST 新增）</button><button id='cb-edit' class='mini'>更新（PUT 仅既有）</button></div></section>" +
    "<section class='card'><h3>测试回调地址 <span class='hint'>POST /api/v1/admin/callbacks/test · 探测不落库</span></h3>" +
    "<div class='row'><label>URL <input id='cbt-url' size='40' placeholder='http://127.0.0.1:…/cb'></label>" +
    "<button id='cb-test' class='mini'>测试</button><span id='cbt-result' class='dim'></span></div></section>";
  function selectedType() {
    var el = document.querySelector("input[name='cb-type']:checked");
    return el ? parseInt(el.value, 10) : 1;
  }
  function radioDesc() {
    var v = selectedType();
    $("cb-radio-desc").textContent = CB_TYPES[v] ? "type " + v + "：" + CB_TYPES[v].desc : "";
  }
  forEach("input[name='cb-type']", function (r) { r.onchange = radioDesc; });
  radioDesc();
  function load() {
    Promise.all([
      api("GET", "/api/v1/admin/callbacks").catch(function () { return null; }),
      api("GET", "/api/v1/admin/devices").catch(function () { return null; })
    ]).then(function (r) {
      var cbs = (r[0] && r[0].callbacks) || [];
      var devices = (r[1] && r[1].devices) || [];
      // robot 候选：设备 robot 绑定 ∪ 既有回调绑定（去重排序）
      var seen = {}, robots = [];
      devices.forEach(function (d) { if (d.robotId && !seen[d.robotId]) { seen[d.robotId] = 1; robots.push(d.robotId); } });
      cbs.forEach(function (c) { if (!seen[c.robotId]) { seen[c.robotId] = 1; robots.push(c.robotId); } });
      $("cb-robots").innerHTML = robots.sort().map(function (rb) { return "<option value='" + esc(rb) + "'>"; }).join("");
      // 按 robot 分组渲染卡片
      var groups = {}, order = [];
      cbs.forEach(function (c) {
        if (!groups[c.robotId]) { groups[c.robotId] = []; order.push(c.robotId); }
        groups[c.robotId].push(c);
      });
      if (!order.length) {
        $("cb-groups").innerHTML = "<section class='card'><div class='empty'>暂无绑定：用下方「添加绑定」为 robot 配置回调（未配置的类型不推送，仅留库 skipped）。</div></section>";
        return;
      }
      $("cb-groups").innerHTML = order.map(function (rb) {
        var rows = groups[rb].map(function (c) {
          var info = CB_TYPES[c.type] || {};
          return "<tr><td>" + cbTypePill(c.type) + "</td>" +
            "<td class='dim'>" + esc(info.desc || c.typeName || "") + "</td>" +
            "<td class='mono'>" + esc(c.callbackUrl) + "</td>" +
            "<td><button class='mini' data-cbtest='" + esc(c.callbackUrl) + "'>测试</button> " +
            "<button class='no mini' data-cbdel='" + esc(rb) + "|" + c.type + "'>删除</button></td></tr>";
        }).join("");
        return "<section class='card'><h3 class='mono'>🤖 " + esc(rb) + "</h3>" +
          "<table><thead><tr><th>类型</th><th>含义</th><th>回调 URL</th><th>操作</th></tr></thead><tbody>" + rows + "</tbody></table></section>";
      }).join("");
      forEach("[data-cbtest]", function (b) {
        b.onclick = function () {
          b.disabled = true;
          api("POST", "/api/v1/admin/callbacks/test", { callBackUrl: b.getAttribute("data-cbtest") })
            .then(function (j) {
              if (j.reachable) okmsg("回调探测通过：" + j.message);
              else banner("回调探测未通过：" + j.message);
            }).catch(function () {}).then(function () { b.disabled = false; });
        };
      });
      forEach("[data-cbdel]", function (b) {
        b.onclick = function () {
          var parts = b.getAttribute("data-cbdel").split("|");
          if (!confirm("删除 robot=" + parts[0] + " 的 type=" + parts[1] + " 绑定？（删除即停用该类推送，事件仅留库 skipped）")) return;
          api("DELETE", "/api/v1/admin/callbacks?robotId=" + encodeURIComponent(parts[0]) + "&type=" + parts[1])
            .then(function () { okmsg("绑定已删除"); load(); }).catch(function () {});
        };
      });
    });
  }
  function bind(op) {
    var body = { robotId: $("cb-robot").value.trim(), type: selectedType(), callBackUrl: $("cb-url").value.trim() };
    if (!body.robotId) { banner("robotId 必填（可从设备列表的 robot 绑定中选择）。"); return; }
    if (!body.callBackUrl) { banner("callBackUrl 必填（http(s) 接收器，默认仅 loopback）。"); return; }
    api(op === "bind" ? "POST" : "PUT", "/api/v1/admin/callbacks", body)
      .then(function () { okmsg("绑定已" + (op === "bind" ? "新增" : "更新") + "（探测通过）"); load(); }).catch(function () {});
  }
  $("cb-add").onclick = function () { bind("bind"); };
  $("cb-edit").onclick = function () { bind("update"); };
  $("cb-test").onclick = function () {
    $("cbt-result").textContent = "探测中…";
    api("POST", "/api/v1/admin/callbacks/test", { callBackUrl: $("cbt-url").value.trim() })
      .then(function (j) { $("cbt-result").textContent = (j.reachable ? "✅ " : "❌ ") + j.message; }).catch(function () {});
  };
  load();
}

    "<div id='bk-info' class='dim'>加载中…</div>" +
    "<div class='row'><button id='bk-reset' class='warn mini'>人工复位为 closed</button></div>" +
    "<p class='note'>字段：state 进程内实时状态（重启回 closed）；windowSeconds 统计窗口；minSamples 最少样本；threshold 失败率阈值；cooldownSeconds 冷却时长；closeSamples 试探闭合连续成功样本。参数调整 scheduler 未导出入口（dodDeferred）。</p></section>" +
    "<section class='card'><h3>事件回调开关（T3.5） <span class='hint'>PUT /api/v1/admin/settings/event-callbacks · 改即生效</span></h3>" +
    "<div class='row'><label><input type='checkbox' id='ev-push'> pushEventCallback 事件回调总门</label></div>" +
    "<p class='note'>总门覆盖被动事件 101 被拉群 / 102 群名更新 / 103 群解散 / 104 被移出群 / 105 好友通过，及查询推送 511/512/513/515（上游缺省开）。推送实际外呼仍须对应 robot 配置 type=11 回调绑定。</p>" +
    "<div class='row'><label><input type='checkbox' id='ev-img'> pushImage 图片回调独立门</label></div>" +
    "<p class='note'>图片 fileBase64 回调独立开关（上游缺省关）。两开关持久化管理面 KV（api 分发内核逐事件只读同源值），改即生效。</p>" +
    "<div class='row'><button id='ev-save' class='primary mini'>保存开关</button><span class='dim' id='ev-src'></span></div></section>" +
    "<section class='card'><h3>通讯加密开关（FR-43）</h3>" +
    "<div class='row'><span id='enc-state' class='dim'>加载中…</span>" +
    "<button id='enc-toggle' class='primary mini'>切换</button></div>" +
    "<p class='note' id='enc-note'></p></section>" +
    "<section class='card'><h3>风险分级查询 <span class='hint'>GET /api/v1/admin/risk/{type} · 单一事实源 scheduler.ClassifyRisk</span></h3>" +
    "<div class='row'><label>指令类型 <input id='rk-type' size='6' placeholder='如 219'></label><button id='rk-go' class='mini'>查询</button><span id='rk-out'></span></div>" +
    "<p class='note'>L1 = 批量发送/转发、建群、拉人；L2 = 解散群、删联系人、清缓存、清队列；未登记类型 L2 fail-closed（FR-53 裁决②③）。</p></section>" +
    "<section class='card'><h3>L1 接收人白名单 <span class='hint'>/api/v1/admin/whitelist（配置即强制，FR-53）</span></h3>" +
    "<div class='row'><label>目标 <input id='wl-target' size='20'></label><button id='wl-load' class='mini'>查看</button></div>" +
    "<div class='row'><label>接收人 <input id='wl-item' size='20'></label><button id='wl-add' class='ok mini'>添加</button></div>" +
    "<div id='wl-list' class='dim'>先查目标。</div></section>" +
    "<section class='card'><h3>API Token 管理 <span class='hint'>列表仅显示 hash 前 8 位；原始值签发时一次返回</span></h3>" +
    "<div class='row'><button id='tk-refresh' class='mini'>刷新列表</button>" +
    "<label>签发 robot 令牌 robotId <input id='tk-robot' size='14'></label><label>tenant <input id='tk-tenant' placeholder='留空 = default' size='12'></label>" +
    "<button id='tk-issue' class='primary mini'>签发</button></div>" +
    "<div id='tk-issued'></div>" +
    "<table><thead><tr><th>hash 前 8 位</th><th>scope</th><th>tenant</th><th>状态</th><th>签发时间</th><th>最近使用</th><th>操作</th></tr></thead>" +
    "<tbody id='tk-body'><tr><td colspan='7' class='empty'>尚未加载</td></tr></tbody></table>" +
    "<p class='note'>吊销按 robot 全量旋转（active 全部失效）；管理面令牌（scope=admin）经 SQL/IssueAdminToken 签发，不走本表操作。</p></section>" +
    "</div>" +
    "<section class='card'><h3>关于</h3><ul class='expl'>" +
    "<li><b>版本</b>：WorkTool-Open 单文件管理台（零构建链、零外部资源）；服务端暂无版本查询端点，发布版本以仓库标签/发布说明为准。</li>" +
    "<li><b>协议文档</b>：仓库 docs/ 目录（开放 API 契约、指令状态机与权限矩阵）；在线外链占位待补，本页不引外部资源。</li>" +
    "<li><b>管理员令牌安全</b>：令牌仅存 SHA-256 hash（原始值签发时一次返回，库内不可还原）；怀疑泄露时在服务器以启动参数 <span class='mono'>-issue-admin-token</span> 换发新令牌（打印后退出），并另行吊销旧令牌。</li>" +
    "</ul></section>";
  function loadOverview() {
    api("GET", "/api/v1/admin/overview").then(function (j) {
      $("st-online").innerHTML = j.devicesOnline + "<small> / " + j.devicesTotal + " 台</small>";
      $("st-cmds").innerHTML = j.todayCommands + "<small> 成功 " + j.todaySucceeded + " · 失败 " + j.todayFailed + "</small>";
      var pct = (j.todayErrorRate * 100);
      $("st-rate").innerHTML = (pct ? pct.toFixed(1) : "0") + "%";
      $("st-rate-card").className = "stat " + (pct >= 50 ? "err" : pct > 0 ? "" : "ok");
      $("st-appr").textContent = j.pendingApprovals;
      $("st-queue").textContent = j.queuedCommands;
      $("st-cbs").textContent = j.pendingCallbacks;
    }).catch(function () {
      $("st-online").textContent = "—"; $("st-cmds").textContent = "—"; $("st-rate").textContent = "—";
      $("st-appr").textContent = "—"; $("st-queue").textContent = "—"; $("st-cbs").textContent = "—";
    });
  }
  function loadSettings() {
    api("GET", "/api/v1/admin/settings").then(function (j) {
      $("g-window").value = j.guard.l1WindowSeconds;
      $("g-max").value = j.guard.l1MaxPerTx;
      $("g-deny").checked = !!j.guard.whitelistDefaultDeny;
      $("g-src").textContent = "当前来源：" + j.guard.source + "（default=管线默认 / persisted=管理面持久化值）";
      $("bk-info").innerHTML = "状态 <span class='pill st-" + esc(j.breaker.state) + "'>" + esc(j.breaker.state) + "</span> · 窗口 " + j.breaker.windowSeconds + "s / 最少样本 " + j.breaker.minSamples + " / 失败率阈值 " + (j.breaker.threshold * 100) + "% / 冷却 " + j.breaker.cooldownSeconds + "s / 试探闭合 " + j.breaker.closeSamples + " 连成";
      setEncState(!!j.encryption.enabled);
      $("enc-note").textContent = j.encryption.note;
      $("ev-push").checked = !!j.eventCallbacks.pushEventCallback;
      $("ev-img").checked = !!j.eventCallbacks.pushImage;
      $("ev-src").textContent = "当前来源：" + j.eventCallbacks.source + "（default=上游缺省：总门开、图片关）";
      var c = j.counts || {};
      $("st-counts").textContent = "设置计数（GET /settings · counts）：活跃令牌 " + (c.activeTokens != null ? c.activeTokens : "—") +
        " 枚 · 白名单条目 " + (c.whitelistEntries != null ? c.whitelistEntries : "—") + " 条";
    }).catch(function () {});
  }
  $("g-save").onclick = function () {
    api("PUT", "/api/v1/admin/settings/guard", {
      l1WindowSeconds: parseInt($("g-window").value, 10) || 60,
      l1MaxPerTx: parseInt($("g-max").value, 10) || 10,
      whitelistDefaultDeny: $("g-deny").checked
    }).then(function (j) { okmsg("限流/白名单策略已应用并持久化"); loadSettings(); }).catch(function () {});
  };
  $("bk-reset").onclick = function () {
    if (!confirm("人工复位全局熔断为 closed？")) return;
    api("POST", "/api/v1/admin/breaker/reset", {}).then(function (j) { okmsg("熔断已复位（changed=" + j.changed + "）"); loadSettings(); }).catch(function () {});
  };
  $("ev-save").onclick = function () {
    api("PUT", "/api/v1/admin/settings/event-callbacks", {
      pushEventCallback: $("ev-push").checked,
      pushImage: $("ev-img").checked
    }).then(function () { okmsg("事件回调开关已更新并持久化（分发内核逐事件读取，改即生效）"); loadSettings(); }).catch(function () {});
  };
  $("rk-go").onclick = function () {
    var t = $("rk-type").value.trim();
    if (!t) return;
    api("GET", "/api/v1/admin/risk/" + encodeURIComponent(t)).then(function (j) {
      $("rk-out").innerHTML = "type " + j.type + " → " + riskPill(j.riskClass);
    }).catch(function () {});
  };
  var encOn = false;
  function setEncState(on) {
    encOn = on;
    $("enc-state").innerHTML = "当前：<span class='pill " + (on ? "on" : "off") + "'>" + (on ? "开" : "关（默认）") + "</span>";
  }
  $("enc-toggle").onclick = function () {
    api("PUT", "/api/v1/admin/settings/encryption", { enabled: !encOn })
      .then(function () { okmsg("通讯加密开关已更新（强制执行边界见注释）"); loadSettings(); }).catch(function () {});
  };
  var wlTarget = "";
  function wlRender(list) {
    $("wl-list").innerHTML = (list && list.length)
      ? list.map(function (r) { return "<span class='pill' style='margin:2px'>" + esc(r) + " <button class='mini no' data-wlrm='" + esc(r) + "'>×</button></span>"; }).join(" ")
      : "<span class='dim'>该目标未配置白名单（未配置不拦截，靠限速兜底；勾选默认拒收可收紧）</span>";
    forEach("[data-wlrm]", function (b) {
      b.onclick = function () {
        api("DELETE", "/api/v1/admin/whitelist?target=" + encodeURIComponent(wlTarget) + "&recipient=" + encodeURIComponent(b.getAttribute("data-wlrm")))
          .then(function () { okmsg("已移除"); wlLoad(); }).catch(function () {});
      };
    });
  }
  function wlLoad() {
    wlTarget = $("wl-target").value.trim();
    if (!wlTarget) { banner("先填写目标。"); return; }
    api("GET", "/api/v1/admin/whitelist?target=" + encodeURIComponent(wlTarget)).then(function (j) { wlRender(j.recipients); }).catch(function () {});
  }
  $("wl-load").onclick = wlLoad;
  $("wl-add").onclick = function () {
    wlTarget = $("wl-target").value.trim();
    var item = $("wl-item").value.trim();
    if (!wlTarget || !item) { banner("目标与接收人均必填。"); return; }
    api("POST", "/api/v1/admin/whitelist", { target: wlTarget, recipient: item })
      .then(function () { okmsg("白名单已添加"); $("wl-item").value = ""; wlLoad(); }).catch(function () {});
  };
  function tkLoad() {
    api("GET", "/api/v1/admin/tokens").then(function (j) {
      var rows = (j.tokens || []).map(function (t) {
        var revoke = t.scope.indexOf("admin") === 0 ? "<span class='dim'>—</span>"
          : "<button class='no mini' data-tkrev='" + esc(t.robotId) + "'>吊销全部</button>";
        return "<tr><td class='mono'>" + esc(t.hashPrefix8) + "…</td><td>" + esc(t.scope) + "</td><td>" + esc(t.tenant) + "</td>" +
          "<td><span class='pill st-" + esc(t.status) + "'>" + esc(t.status) + "</span></td>" +
          "<td class='mono'>" + fmtMs(t.createdMs) + "</td><td class='mono'>" + fmtMs(t.lastUsedMs) + "</td><td>" + revoke + "</td></tr>";
      });
      $("tk-body").innerHTML = rows.join("") || "<tr><td colspan='7' class='empty'>暂无令牌</td></tr>";
      forEach("[data-tkrev]", function (b) {
        b.onclick = function () {
          if (!confirm("吊销 robot=" + b.getAttribute("data-tkrev") + " 的全部 active 令牌？")) return;
          api("DELETE", "/api/v1/admin/robots/" + encodeURIComponent(b.getAttribute("data-tkrev")) + "/openapi-tokens")
            .then(function (j2) { okmsg("已吊销 " + j2.revoked + " 枚"); tkLoad(); }).catch(function () {});
        };
      });
    }).catch(function () {});
  }
  $("tk-refresh").onclick = tkLoad;
  $("tk-issue").onclick = function () {
    var robot = $("tk-robot").value.trim();
    if (!robot) { banner("robotId 必填。"); return; }
    // CR ADM-1：tenant 留空 = 默认租户 default——不发请求体（服务端亦对 {} 体回落
    // default，双层修复；此前空租户体 {} 会被 400 拒绝）
    var tenant = $("tk-tenant").value.trim();
    var req = tenant
      ? api("POST", "/api/v1/admin/robots/" + encodeURIComponent(robot) + "/openapi-tokens", { tenant: tenant })
      : api("POST", "/api/v1/admin/robots/" + encodeURIComponent(robot) + "/openapi-tokens");
    req.then(function (j) {
      $("tk-issued").innerHTML = "<p class='note' style='color:var(--warn)'>robot " + esc(j.robotId) + " 令牌（仅此一次显示，仅存 hash）：<span class='mono'>" + esc(j.token) + "</span></p>";
      okmsg("令牌已签发（原始值仅此一次）"); tkLoad();
    }).catch(function () {});
  };
  loadOverview();
  loadSettings();
  tkLoad();
}

/* ============ 令牌栏与启动 ============ */
$("save-token").onclick = function () {
  token = $("token").value.trim();
  localStorage.setItem(TOKEN_KEY, token);
  route(); // 重新加载当前视图（带新令牌）
};
$("clear-token").onclick = function () {
  token = ""; localStorage.removeItem(TOKEN_KEY); $("token").value = "";
};
$("token").value = token;
route();
</script>
</body>
</html>
