<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WorkTool-Open 管理台</title>
<style>
  /* 浅色科技风主题（冰白底 #f7f9fc / 钴蓝主色 #2563eb / 深空蓝强调 #1e3a5f）
     · 单文件内嵌 CSS · 零外部资源（无 CDN/字体/图片，G3/G4 纪律）
     · 状态徽标：成功绿 / 失败红 / 等待黄 / 未知灰 */
  :root {
    --bg:#f7f9fc; --panel:#ffffff; --panel2:#eef3fb; --line:#d9e2ef;
    --fg:#16243a; --dim:#5c6b84; --deep:#1e3a5f;
    --acc:#2563eb; --acc-dk:#1d4ed8; --acc-bg:#e8effd;
    --ok:#15803d; --ok-bg:#e7f6ec;
    --warn:#b45309; --warn-bg:#fdf3e0;
    --err:#dc2626; --err-bg:#fdeaea;
    --unk:#64748b; --unk-bg:#eef1f5;
    --mono:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
    --shadow:0 1px 2px rgba(22,36,58,.05), 0 2px 10px rgba(22,36,58,.07);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.65 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  /* ---- 布局：左导航 + 右内容 + 深空蓝顶栏 ---- */
  #app { display:grid; grid-template-columns:212px 1fr; grid-template-rows:52px 1fr;
         grid-template-areas:"brand topbar" "nav content"; height:100vh; }
  #brand { grid-area:brand; display:flex; align-items:center; gap:9px; padding:0 14px;
           background:var(--deep); color:#f4f8ff; font-weight:700; }
  #brand .logo { width:22px; height:22px; border-radius:6px; background:var(--acc);
                 display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:#fff; }
  #brand small { display:block; color:#b9cbe6; font-weight:400; font-size:10px; }
  #topbar { grid-area:topbar; display:flex; align-items:center; justify-content:space-between;
            gap:12px; padding:0 18px; background:var(--deep); color:#e8f0fb; border-bottom:1px solid #16304e; }
  #crumbs { color:#b9cbe6; font-size:13px; }
  #crumbs b { color:#ffffff; font-weight:600; }
  #sync-time { color:#8fa9c9; font-size:11.5px; font-family:var(--mono); }
  #authbar { display:flex; gap:8px; align-items:center; }
  #authbar .env { font-size:11px; color:#cfe0f5; border:1px solid #3d5a82; border-radius:10px; padding:1px 9px; }
  #nav { grid-area:nav; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line);
         padding:12px 0 30px; }
  #nav .group { margin:12px 0 4px; padding:0 16px; font-size:11px; color:var(--dim); letter-spacing:2px; }
  #nav a { display:flex; align-items:center; gap:9px; padding:8px 16px; color:var(--fg);
           text-decoration:none; font-size:13.5px; border-left:3px solid transparent; }
  #nav a::before { content:""; width:8px; height:8px; flex:none; border-radius:2px; border:2px solid var(--dim); }
  #nav a:hover { background:var(--panel2); }
  #nav a.active { background:var(--acc-bg); border-left-color:var(--acc); color:var(--acc-dk); font-weight:600; }
  #nav a.active::before { border-color:var(--acc); background:var(--acc); }
  #content { grid-area:content; overflow-y:auto; padding:18px 22px 60px; }
  #content a { color:var(--acc-dk); }
  /* ---- 通用元件 ---- */
  h2.view { margin:0; font-size:18px; color:var(--deep); }
  .sub { color:var(--dim); font-size:12.5px; margin:2px 0 14px; }
  .pagehead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  section.card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
                 box-shadow:var(--shadow); padding:14px 16px; margin:0 0 16px; }
  section.card > h3 { margin:0 0 10px; font-size:13.5px; color:var(--deep); }
  section.card > h3 .hint { color:var(--dim); font-weight:400; font-size:11.5px; margin-left:8px; }
  input, select, textarea, button { background:#ffffff; color:var(--fg); border:1px solid var(--line);
           border-radius:8px; padding:5px 10px; font:inherit; }
  textarea { font-family:var(--mono); font-size:12.5px; width:100%; }
  button { cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button:disabled { opacity:.5; cursor:not-allowed; border-color:var(--line); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#ffffff; font-weight:600; }
  button.primary:hover:not(:disabled) { background:var(--acc-dk); }
  button.ghost { background:var(--acc-bg); border-color:var(--acc); color:var(--acc-dk); font-weight:600; }
  button.ok { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  button.no { background:var(--err-bg); border-color:var(--err); color:var(--err); }
  button.warn { background:var(--warn-bg); border-color:var(--warn); color:var(--warn); }
  button.mini { padding:2px 9px; font-size:12px; border-radius:7px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .row label { display:flex; gap:5px; align-items:center; font-size:13px; color:var(--dim); }
  table { width:100%; border-collapse:collapse; font-size:12.8px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; white-space:nowrap; }
  td.mono, .mono { font-family:var(--mono); font-size:12px; }
  /* 状态徽标：成功绿/失败红/等待黄/未知灰（颜色之外带文字，不单靠色区分） */
  .pill { display:inline-block; padding:1px 9px; border-radius:10px; font-size:11.5px;
          border:1px solid var(--line); background:var(--panel2); color:var(--dim); white-space:nowrap; }
  .pill.on, .pill.st-delivered, .pill.st-succeeded, .pill.st-active { color:var(--ok); border-color:var(--ok); background:var(--ok-bg); }
  .pill.off, .pill.st-dead, .pill.st-failed, .pill.st-revoked, .pill.st-paused,
  .pill.st-expired, .pill.st-rejected, .pill.st-cancelled { color:var(--err); border-color:var(--err); background:var(--err-bg); }
  .pill.st-pending, .pill.warn, .pill.dry, .pill.st-awaiting_approval { color:var(--warn); border-color:var(--warn); background:var(--warn-bg); }
  .pill.st-skipped, .pill.unk, .pill.st-execution_unknown { color:var(--unk); border-color:var(--unk); background:var(--unk-bg); }
  .pill.L2 { color:var(--err); border-color:var(--err); background:var(--err-bg); }
  .pill.L1 { color:var(--warn); border-color:var(--warn); background:var(--warn-bg); }
  .pill.L0 { color:var(--ok); border-color:var(--ok); background:var(--ok-bg); }
  .pill.st-queued, .pill.st-dispatched, .pill.st-acked, .pill.st-running { color:var(--acc-dk); border-color:var(--acc); background:var(--acc-bg); }
  .pill.edge { color:var(--acc-dk); border-color:var(--acc); background:var(--acc-bg); font-family:var(--mono); }
  .pill.edge.term { color:var(--ok); border-color:var(--ok); background:var(--ok-bg); }
  .pill.edge.unk { color:var(--unk); border-color:var(--unk); background:var(--unk-bg); }
  .pill.cb1 { color:var(--acc-dk); border-color:var(--acc); background:var(--acc-bg); }
  .pill.cb11 { color:var(--ok); border-color:var(--ok); background:var(--ok-bg); }
  .dim { color:var(--dim); }
  .empty { color:var(--dim); padding:10px 0; }
  .errline { color:var(--err); font-family:var(--mono); font-size:12px; }
  #banner { background:var(--err-bg); border:1px solid var(--err); color:#8f1d1d; border-radius:10px;
            padding:8px 12px; margin:0 0 12px; display:none; }
  #okmsg { background:var(--ok-bg); border:1px solid var(--ok); color:#14532d; border-radius:10px;
           padding:8px 12px; margin:0 0 12px; display:none; }
  pre.json { background:#0f1e33; color:#d7e4f7; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
             font-family:var(--mono); font-size:12px; overflow-x:auto; margin:8px 0; white-space:pre-wrap; word-break:break-all; }
  /* 概览指标卡 */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:12px 14px; }
  .stat.click { cursor:pointer; }
  .stat.click:hover { border-color:var(--acc); }
  .stat .k { color:var(--dim); font-size:12px; }
  .stat .v { font-size:24px; font-weight:700; font-family:var(--mono); margin-top:2px; color:var(--deep); }
  .stat .v small { font-size:12px; color:var(--dim); font-weight:400; }
  .stat .d { font-size:11px; color:var(--dim); margin-top:4px; line-height:1.4; }
  .stat.ok .v { color:var(--ok); } .stat.err .v { color:var(--err); } .stat.acc .v { color:var(--acc-dk); }
  .stat.unk .v { color:var(--unk); }
  /* 任务时间线 */
  .tl { border-left:2px solid var(--line); margin:8px 0 4px 6px; padding-left:16px; }
  .tl .item { position:relative; padding:4px 0 10px; }
  .tl .item::before { content:""; position:absolute; left:-21px; top:10px; width:8px; height:8px;
                      border-radius:50%; background:var(--acc); }
  .tl .item.term::before { background:var(--ok); }
  .tl .item.unk::before { background:var(--unk); }
  .tl .head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tl .meta { color:var(--dim); font-size:12px; }
  .tl .detail { font-family:var(--mono); font-size:11.5px; color:var(--dim); word-break:break-all; }
  /* 弹层（详情/危险确认/抽屉） */
  #modal { position:fixed; inset:0; background:rgba(22,36,58,.45); display:none;
           align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto; }
  #modal .box { background:var(--panel); border:1px solid var(--line); border-radius:14px;
                box-shadow:0 10px 40px rgba(22,36,58,.25); max-width:960px; width:100%; padding:16px 18px; }
  #modal .box.narrow { max-width:560px; }
  #modal .box h3 { margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; color:var(--deep); }
  /* 配对码（仅在签发后渲染，绝无 000000 占位） */
  #pd-code .codebig { font:700 34px/1 var(--mono); letter-spacing:8px; color:var(--acc-dk);
              background:var(--acc-bg); border:1px dashed var(--acc); border-radius:10px; padding:12px 18px; }
  #pd-code .codeexpired { font:700 20px/1 var(--mono); letter-spacing:4px; color:var(--unk);
              background:var(--unk-bg); border:1px dashed var(--unk); border-radius:10px; padding:16px 18px; }
  .note { font-size:12px; color:var(--dim); margin-top:6px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-home { display:grid; grid-template-columns:2fr 1fr; gap:16px; }
  @media (max-width:980px){ #app{ grid-template-columns:60px 1fr; } #nav a span.txt,#nav .group,#brand small{ display:none; } .grid2,.grid-home{ grid-template-columns:1fr; } }
  /* 任务工作区：六步引导 + 左主区/右摘要 */
  .steps { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
  .steps span { padding:3px 11px; border-radius:14px; border:1px solid var(--line); color:var(--dim);
                font-size:12px; background:var(--panel); }
  .steps span b { color:var(--acc-dk); font-weight:600; }
  .steps span.done { border-color:var(--ok); color:var(--ok); background:var(--ok-bg); }
  .steps span.done b { color:var(--ok); }
  .wiz { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start; }
  @media (max-width:1100px){ .wiz { grid-template-columns:1fr; } }
  .wizside { position:sticky; top:0; }
  .pickbox { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:10px; }
  .hiddenbox { display:none; }
  .warnbox { background:var(--warn-bg); border:1px solid var(--warn); color:#7a4106; border-radius:10px;
             padding:8px 12px; margin:8px 0; font-size:12.8px; }
  .warnbox a { color:#7a4106; }
  .oknote { background:var(--ok-bg); border:1px solid var(--ok); color:#14532d; border-radius:10px;
            padding:8px 12px; margin:8px 0; font-size:12.8px; }
  .approvebox { background:var(--warn-bg); border:1px solid var(--warn); color:#7a4106; border-radius:10px;
             padding:10px 12px; margin:8px 0; font-size:13px; }
  .stalebox { background:var(--warn-bg); border:1px dashed var(--warn); color:#7a4106; border-radius:8px;
             padding:5px 10px; margin:6px 0; font-size:12.3px; }
  .gatereasons { color:var(--err); font-size:12.3px; }
  label.param { display:block; margin:8px 0 2px; color:var(--dim); font-size:13px; }
  label.param input, label.param textarea, label.param select { margin-top:3px; color:var(--fg); }
  details.adv { border:1px dashed var(--line); border-radius:10px; padding:8px 12px; margin:10px 0 0; background:var(--panel2); }
  details.adv summary { cursor:pointer; color:var(--dim); font-size:12.8px; user-select:none; }
  ul.expl { margin:4px 0 2px; padding-left:18px; color:var(--dim); font-size:12.6px; }
  ul.expl li { margin:4px 0; }
  ul.expl b { color:var(--fg); }
  .concl { border-left:5px solid var(--line); }
  .concl .ctitle { font-size:15.5px; font-weight:700; color:var(--deep); }
  .concl .cdetail { font-size:12.8px; margin-top:2px; }
  .concl ul { margin:6px 0 2px; padding-left:20px; font-size:12.5px; color:var(--dim); }
  .bigempty { text-align:center; padding:36px 0; }
  .bigempty p { margin:4px 0; }
  .btnlink { display:inline-block; border:1px solid var(--acc); color:var(--acc-dk); background:var(--acc-bg);
             border-radius:8px; padding:5px 14px; text-decoration:none; font-size:13px; }
  /* 工作区页签 */
  .wstabs { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px; }
  .wtab { border:1px solid var(--line); background:var(--panel); color:var(--dim); border-radius:9px;
          padding:4px 14px; font-size:13px; text-decoration:none; }
  .wtab:hover { border-color:var(--acc); color:var(--acc-dk); }
  .wtab.active { background:var(--acc); border-color:var(--acc); color:#ffffff; font-weight:600; }
  ol.steps-v { padding-left:20px; color:var(--dim); font-size:12.8px; }
  ol.steps-v li { margin:6px 0; }
  .slowhint { color:var(--warn); }
  table.sum th { width:96px; color:var(--dim); font-weight:400; vertical-align:top; }
</style>
</head>
<body>
<div id="app">
  <div id="brand"><span class="logo">WT</span><span>WorkTool-Open<small>管理台 · 单文件 · 零外部资源</small></span></div>
  <div id="topbar">
    <div id="crumbs"><span id="crumb-ws">工作台</span> / <b id="crumb-view">概览</b></div>
    <div id="sync-time">尚未加载数据</div>
    <div id="authbar">
      <span class="env">演示环境 · 合成数据</span>
      <span id="auth-state" class="pill warn">未设置令牌</span>
      <button id="open-session" class="mini">会话</button>
    </div>
  </div>
  <nav id="nav">
    <div class="group">工作区</div>
    <a href="#/home" data-ws="home"><span class="txt">工作台</span></a>
    <a href="#/devices" data-ws="devices"><span class="txt">设备</span></a>
    <a href="#/tasks-send" data-ws="tasks"><span class="txt">任务</span></a>
    <a href="#/int-callbacks" data-ws="integrations"><span class="txt">集成</span></a>
    <a href="#/settings" data-ws="config"><span class="txt">设置与审计</span></a>
  </nav>
  <main id="content">
    <div id="banner"></div>
    <div id="okmsg"></div>
    <div id="view"></div>
    <div class="note" id="foot">
      数据全部来自本服务（无第三方资源/字体/统计）· 指令正文仅在任务详情面展示（列表仅元数据）·
      令牌仅存 SHA-256 hash（原始值一次返回）· TLS 部署下使用（SR-01/09）· 演示环境示例均为合成数据。
    </div>
  </main>
</div>
<div id="modal"><div class="box" id="modal-box"></div></div>

<script>
"use strict";
/* ============ 基础设施（保留：令牌管理 / API 封装 / 弹层确认） ============ */
var TOKEN_KEY = "wt_admin_token", APPROVER_KEY = "wt_admin_approver";
// P0-3：决议专用 approver 令牌（与登录用管理令牌分持分存；决议请求单独携带）。
var APPROVER_TOKEN_KEY = "wt_approver_token";
var token = localStorage.getItem(TOKEN_KEY) || "";
var approverToken = localStorage.getItem(APPROVER_TOKEN_KEY) || "";
// #token= 深链吸收（吸收后立即抹除，防随链接二次泄露）；其余 hash 一律视为路由。
(function absorbToken() {
  var m = location.hash.match(/^#token=(.+)$/);
  if (m) {
    token = decodeURIComponent(m[1]);
    localStorage.setItem(TOKEN_KEY, token);
    history.replaceState(null, "", location.pathname + location.search);
  }
})();
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtMs(ms) {
  if (!ms) return "—";
  return new Date(ms).toISOString().replace("T", " ").replace(".000Z", "Z");
}
function banner(msg) { var b = $("banner"); b.textContent = msg || ""; b.style.display = msg ? "block" : "none"; }
function okmsg(msg) { var b = $("okmsg"); b.textContent = msg || ""; b.style.display = msg ? "block" : "none"; }
// api 封装（保留语义：Bearer 头/JSON 体/401 引导/错误横幅；P0-3：第 4 参 tok 可选——
// 缺省用管理令牌，传入（决议请求）用 approver 决议令牌，决议只认 approver scope）
// + v3 增强：20s 超时（AbortController）——超时抛 err.timeout=true，由页面渲染
// 「请求超时」状态，不再永远转圈。成功响应刷新全局数据更新时间（顶栏展示）。
var API_TIMEOUT_MS = 20000;
function api(method, path, body, tok) {
  var bearer = tok !== undefined ? tok : token;
  var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, API_TIMEOUT_MS) : null;
  var opt = { method: method, headers: { "Authorization": "Bearer " + bearer } };
  if (ctrl) opt.signal = ctrl.signal;
  if (body !== undefined) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  return fetch(path, opt).then(function (r) {
    if (timer) clearTimeout(timer);
    return r.json().catch(function () { return {}; }).then(function (j) {
      window.__lastSync = Date.now();
      if (r.status === 401) {
        banner("鉴权失败（401）：" + (tok !== undefined ? "请到「任务 → 审批」检查决议令牌（服务器 -issue-approver-token 签发）。" : "请点顶栏「会话」检查管理面 Token 后保存。"));
        var e = new Error("401"); e.status = 401; throw e;
      }
      if (!r.ok) {
        banner("请求失败（" + r.status + " " + (j.error || "") + "）：" + (j.message || r.statusText));
        var e2 = new Error(String(r.status)); e2.status = r.status; throw e2;
      }
      banner(""); return j;
    });
  }, function (err) {
    if (timer) clearTimeout(timer);
    if (ctrl && err && err.name === "AbortError") {
      var e3 = new Error("timeout"); e3.timeout = true; throw e3;
    }
    throw err;
  });
}
function openModal(html, narrow) {
  var box = $("modal-box");
  box.innerHTML = html;
  box.className = "box" + (narrow ? " narrow" : "");
  $("modal").style.display = "flex";
}
function closeModal() { $("modal").style.display = "none"; $("modal-box").innerHTML = ""; }
$("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeModal(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
// confirmBox：弹层式二次确认（危险操作防误触；比原生 confirm 可承载完整影响说明）
function confirmBox(title, bodyHtml, okLabel, onOk) {
  openModal("<h3>" + title + "<button class='mini' onclick='closeModal()'>关闭</button></h3>" + bodyHtml +
    "<div class='row'><button id='modal-ok' class='no'>" + esc(okLabel || "确认") + "</button>" +
    "<button class='mini' onclick='closeModal()'>取消</button></div>", true);
  $("modal-ok").onclick = function () { closeModal(); onOk(); };
}
function copyText(t) {
  return function () {
    var done = function () { okmsg("已复制到剪贴板（不写入日志）"); };

function prettyJSON(v) {

var autoTimers = {}; // boxId → interval 句柄（每视图至多一个；切页统一清理）
function clearAuto() {
  Object.keys(autoTimers).forEach(function (k) { clearInterval(autoTimers[k]); });
  autoTimers = {};
}
function bindAuto(boxId, fn) {
  $(boxId).addEventListener("change", function () {
    if (autoTimers[boxId]) { clearInterval(autoTimers[boxId]); delete autoTimers[boxId]; }
    if ($(boxId).checked) { fn(); autoTimers[boxId] = setInterval(fn, 5000); }
  });
}
function stopAuto(boxId) {
  if (autoTimers[boxId]) { clearInterval(autoTimers[boxId]); delete autoTimers[boxId]; }
}
var ROUTE_Q = {}; // hash 问询参数（?state=… 等筛选进 URL，规格 §2.2）
function parseQuery(qs) {
  var out = {};
  String(qs || "").split("&").forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf("=");
    if (i < 0) out[kv] = ""; else out[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  return out;
}
function route() {
  var name = (location.hash || "#/home").replace(/^#\//, "") || "home";
  var qi = name.indexOf("?");
  ROUTE_Q = qi >= 0 ? parseQuery(name.slice(qi + 1)) : {};
  if (qi >= 0) name = name.slice(0, qi);
  if (LEGACY[name]) { history.replaceState(null, "", "#/" + LEGACY[name]); name = LEGACY[name]; }
  if (!ROUTES[name]) name = "home";
  clearAuto(); closeModal(); okmsg("");
  $("crumb-ws").textContent = WORKSPACES[ROUTES[name].ws];
  $("crumb-view").textContent = ROUTES[name].title;
  var links = document.querySelectorAll("#nav a");
  for (var i = 0; i < links.length; i++)
    links[i].classList.toggle("active", links[i].getAttribute("data-ws") === ROUTES[name].ws);
  ROUTES[name].render();
}
window.addEventListener("hashchange", route);

        "<div class='detail'>" + esc(e.detail) + "</div></div>";
    }).join("") || "<div class='empty'>暂无事件记录（不以本地推断补画节点；「缺少开始证据」属于结果未知核对范畴）</div>") + "</div></section>" +
    "<section class='card'><h3>载荷 <span class='hint'>提交内容快照（只读）</span></h3><pre class='json'>" + esc(prettyJSON(c.payload)) + "</pre></section>" +
    "</div>" +
    "<section class='card'><h3>结果回执 <span class='hint'>outbox exec_result · errorCode/lastError 即错误原因</span></h3>" + resultsHtml + "</section>" +
    "<section class='card'><h3>通知投递（回调） <span class='hint'>投递与执行相互独立：投递失败不把任务涂红为失败</span></h3>" +
    "<div id='tc-cb'><div class='empty'>加载中…</div></div>" +
    "<p class='note'>本区按最近 200 条投递记录过滤本任务（接口暂不支持按 commandId 过滤，不冒充全量）；全部记录见「集成 → 投递记录」。</p></section>" +
    "<section class='card'><h3>服务端事件流核对 <span class='hint'>GET logs/executions?commandId= · 全局流投影与时间线互证</span></h3>" +
    "<div id='tc-ev'><div class='empty'>加载中…</div></div></section>";
  var cc = $("tc-cmdcopy");
  if (cc) cc.onclick = copyText(String(c.commandId));
  var cn = $("tc-copynew");
  if (cn) cn.onclick = function () { copyTaskAsDraft(c); };
  taskDeliverySection(String(c.commandId)).then(function (html) {
    var box = $("tc-cb");
    if (box) box.innerHTML = html;
  }).catch(function () {
    var box = $("tc-cb");
    if (box) box.innerHTML = "<p class='empty'>投递记录读取失败（不影响上方执行结论）——可到「集成 → 投递记录」排查。</p>";
  });
  taskEventStreamSection(String(c.commandId)).then(function (html) {
    var box = $("tc-ev");
    if (box) box.innerHTML = html;
  }).catch(function () {
    var box = $("tc-ev");
    if (box) box.innerHTML = "<p class='empty'>事件流核对读取失败（不影响上方执行结论）——可刷新重试。</p>";
  });
}
function copyTaskAsDraft(c) {
  // 复制为新任务：重新走预检/审批，新幂等键（不复用旧审批/旧预检/旧提交键）
  WIZ.deviceId = "";
  WIZ.prefillTarget = String(c.target || "");
  WIZ.type = c.type;
  WIZ.manual = false;
  WIZ.dryReport = undefined;
  WIZ.approval = null;
  WIZ.lastBody = null;
  WIZ.devicesStale = false;
  okmsg("已载入为新任务草稿：请确认设备与参数，重新干跑预检后提交（新幂等键）。");
  location.hash = "#/tasks-send";
}

/* ============ 任务工作区 · 历史（S08：筛选/分页/直达详情） ============ */
var cmdOffset = 0;
function renderCommands() {
  $("view").innerHTML = wsTabs("tasks", "tasks-history") +
    "<div class='pagehead'><div><h2 class='view'>历史任务</h2>" +
    "<p class='sub'>GET /api/v1/admin/commands?state=&type=&target=&limit=&offset= · 列表仅元数据；载荷与结果在任务详情面展示</p></div>" +
    "<button id='cmd-new' class='primary'>新建任务</button></div>" +
    "<div id='cmd-stale'></div>" +
    "<section class='card'><div class='row'>" +
    "<label>状态 <select id='cmd-state'>" + STATES.map(function (s) { return "<option value='" + s + "'>" + (s ? stName(s) : "全部") + "</option>"; }).join("") + "</select></label>" +
    "<label>类型 <input id='cmd-type' placeholder='如 203' size='6'></label>" +
    "<label>目标 <input id='cmd-target' placeholder='deviceId / v1:robotId' size='18'></label>" +
    "<label>每页 <select id='cmd-limit'><option>20</option><option selected>50</option><option>100</option></select></label>" +
    "<button id='cmd-refresh' class='mini'>查询</button><label><input type='checkbox' id='cmd-auto'> 5s 自动</label>" +
    "<span class='dim' id='cmd-total'></span><span class='dim' id='cmd-cat-note'></span></div>" +
    "<div class='row'><button id='cmd-prev' class='mini'>上一页</button><button id='cmd-next' class='mini'>下一页</button><span class='dim mono' id='cmd-page'></span></div>" +
    "<table><thead><tr><th>时间</th><th>任务/动作</th><th>目标</th><th>commandId</th><th>状态</th><th>风险</th><th>干跑</th><th></th></tr></thead>" +
    "<tbody id='commands-body'><tr><td colspan='8' class='empty'>加载中…</td></tr></tbody></table></section>";
  $("cmd-new").onclick = function () { location.hash = "#/tasks-send"; };
  if (ROUTE_Q.state) {
    var sel = $("cmd-state");
    if (sel && STATES.indexOf(ROUTE_Q.state) >= 0) sel.value = ROUTE_Q.state;
  }
  function load() {
    setState($("commands-body"), "loading", 8);
    loadCatalog().then(function () {
      $("cmd-cat-note").textContent = CAT.ok ? "" : "（目录未载：类型显示纯数字）";
      var q = "?limit=" + $("cmd-limit").value + "&offset=" + cmdOffset;
      if ($("cmd-state").value) q += "&state=" + encodeURIComponent($("cmd-state").value);
      if ($("cmd-type").value.trim()) q += "&type=" + encodeURIComponent($("cmd-type").value.trim());
      if ($("cmd-target").value.trim()) q += "&target=" + encodeURIComponent($("cmd-target").value.trim());
      api("GET", "/api/v1/admin/commands" + q).then(function (j) {
        clearStale("cmd-stale");
        $("cmd-total").textContent = "共 " + j.total + " 条";
        var size = parseInt($("cmd-limit").value, 10);
        $("cmd-page").textContent = "offset " + j.offset + "–" + (j.offset + j.count);
        $("cmd-prev").disabled = j.offset <= 0;
        $("cmd-next").disabled = j.offset + size >= j.total;
        var rows = (j.commands || []).map(function (c) {
          return "<tr><td class='mono'>" + fmtMs(c.createdAtMs) + "</td>" +
            "<td>" + typeCell(c.type) + "</td><td class='mono'>" + esc(shortIdPlain(c.target)) + "</td>" +
            "<td>" + shortId(c.commandId) + "</td>" +
            "<td>" + stPill(c.state) + (c.terminalState && c.terminalState !== c.state ? " → " + stPill(c.terminalState) : "") + "</td>" +
            "<td>" + riskPill(c.riskClass) + "</td>" +
            "<td>" + (c.dryRun ? "<span class='pill dry'>干跑</span>" : "<span class='dim'>—</span>") + "</td>" +

        forEach("[data-detail]", function (b) { b.onclick = function () { openTaskCurrent(b.getAttribute("data-detail")); }; });
      }).catch(function (e) {
        // 刷新失败保留旧数据（表格不动）+ 陈旧提示；首次失败显示错误行
        if ($("commands-body").querySelector("button[data-detail]")) {

        } else {
          setState($("commands-body"), (e && e.timeout) ? "timeout" : "error", 8, "", errName(e));
        }
      });
    });
  }
  $("cmd-refresh").onclick = function () { cmdOffset = 0; load(); };
  $("cmd-prev").onclick = function () { cmdOffset = Math.max(0, cmdOffset - parseInt($("cmd-limit").value, 10)); load(); };
  $("cmd-next").onclick = function () { cmdOffset += parseInt($("cmd-limit").value, 10); load(); };
  forEach("select#cmd-state, select#cmd-limit", function (s) { s.onchange = function () { cmdOffset = 0; load(); }; });
  forEach("input#cmd-type, input#cmd-target", function (s) { s.onchange = function () { cmdOffset = 0; load(); }; });
  bindAuto("cmd-auto", load);

/* ============ 任务工作区 · 队列（S11：调度真实可见，不暴露盲目清空） ============ */
var Q_STALE = false;
function renderQueue() {
  $("view").innerHTML = wsTabs("tasks", "tasks-queue") +
    "<div class='pagehead'><div><h2 class='view'>队列</h2>" +
    "<p class='sub'>GET /api/v1/admin/queue · 仅 queued 待执行指令可操作；已下发/执行中不提供取消（无该 Admin 合同）</p></div></div>" +
    "<div id='q-stale'></div>" +
    "<section class='card'><div class='row'>" +
    "<label>按目标筛选（设备/robot，必显） <input id='q-target' placeholder='留空 = 全部目标' size='24'></label>" +
    "<button id='q-refresh' class='mini'>刷新</button><label><input type='checkbox' id='q-auto'> 5s 自动</label>" +
    "<span class='dim' id='q-summary'></span></div>" +
    "<div id='q-banner'></div>" +
    "<table><thead><tr><th>序位</th><th>任务</th><th>目标</th><th>风险</th><th>入队时间</th><th>等待</th><th>操作</th></tr></thead>" +
    "<tbody id='queue-body'><tr><td colspan='7' class='empty'>加载中…</td></tr></tbody></table>" +
    "<div class='row'><label>清空指定目标的待执行指令 <input id='q-clear-target' placeholder='target' size='20'></label>" +
    "<button id='q-clear' class='no mini'>清空该目标队列</button>" +
    "<span class='dim'>不提供全局「清空所有」——清空必须绑定明确目标并逐条落取消回执。</span></div>" +
    "<p class='note'>「移到队首」= 队列序键抬至队首前（原序键留痕审计），不是任意拖拽排序；仅 queued 待执行指令可操作。设备离线时指令持续入队——上线后按序投递；超过 24h 未投递自动取消（E19）。恢复接管后，暂存指令按恢复即丢弃、服务端对账收敛语义处理（v0.1 边界，登记 docs/16）。</p></section>";
  Q_STALE = false;
  function load() {
    setState($("queue-body"), "loading", 7);
    loadCatalog().then(function () {
      var q = "";
      if ($("q-target").value.trim()) q = "?target=" + encodeURIComponent($("q-target").value.trim());
      api("GET", "/api/v1/admin/queue" + q).then(function (j) {
        Q_STALE = false;
        clearStale("q-stale");
        var items = j.queue || [];
        var nQ = items.length;
        var oldest = 0;
        items.forEach(function (c) {
          var age = Date.now() - (c.createdAtMs || 0);
          if (age > oldest) oldest = age;
        });
        var oldestTxt = oldest >= 3600000 ? Math.floor(oldest / 3600000) + " 小时" : Math.max(0, Math.floor(oldest / 60000)) + " 分钟";
        $("q-summary").textContent = "待执行 " + nQ + " 条 · 最长等待 " + (nQ ? oldestTxt : "—");
        $("q-banner").innerHTML = nQ === 0 ? "" : (nQ >= 10
          ? "<div class='warnbox'>队列积压 " + nQ + " 条：设备离线时指令持续入队——上线后按序投递；超过 24h 未投递自动取消（E19）。陈旧项可逐条移除或按目标清空。</div>"
          : "<div class='oknote'>排队 " + nQ + " 条（设备上线后按序投递；24h 未投递自动取消）</div>");
        var rows = items.map(function (c) {
          var ageMs = Date.now() - (c.createdAtMs || 0);
          var ageH = Math.floor(ageMs / 3600000);
          var ageTxt = ageH >= 1 ? (ageH + " 小时") : Math.max(0, Math.floor(ageMs / 60000)) + " 分钟";
          return "<tr><td>" + c.position + "</td><td>" + typeCell(c.type) + "</td>" +
            "<td class='mono'>" + esc(c.target) + "</td><td>" + riskPill(c.riskClass) + "</td>" +
            "<td class='mono'>" + fmtMs(c.createdAtMs) + "</td>" +
            "<td>" + (ageH >= 1 ? "<span class='pill st-pending' title='排队超过 1 小时（24h 自动取消 E19）'>已等 " + ageTxt + "</span>" : "<span class='dim'>" + ageTxt + "</span>") + "</td>" +
            "<td><button class='mini' data-prio='" + esc(c.commandId) + "'>移到队首</button> " +
            "<button class='no mini' data-rm='" + esc(c.commandId) + "'>取消待执行</button></td></tr>";
        });
        $("queue-body").innerHTML = rows.join("") || "<tr><td colspan='7' class='empty'>队列为空（无 queued 待执行指令——与「无设备」「加载失败」是不同状态）</td></tr>";
        forEach("[data-prio]", function (b) {
          b.onclick = function () {
            if (Q_STALE) { banner("队列数据已过期：请先刷新成功后再操作。"); return; }
            api("POST", "/api/v1/admin/queue/" + encodeURIComponent(b.getAttribute("data-prio")) + "/priority", {})
              .then(function (j2) {
                okmsg("已移到队首：" + (j2.adjusted ? "原序位 " + j2.previousPosition + " → 1" : "该指令已在队首"));
                load();
              }).catch(function () {});
          };
        });
        forEach("[data-rm]", function (b) {
          b.onclick = function () {
            if (Q_STALE) { banner("队列数据已过期：请先刷新成功后再操作。"); return; }
            confirmBox("取消待执行任务",
              "<p>确认取消指令 <span class='mono'>" + esc(b.getAttribute("data-rm")) + "</span> 的待执行？</p>" +
              "<p class='dim'>仅 queued 可取消（服务端强制）；被取消指令落 101018 取消回执并留审计——这与「删除历史」不同，历史仍可查。</p>",
              "确认取消", function () {
                api("DELETE", "/api/v1/admin/queue/" + encodeURIComponent(b.getAttribute("data-rm")))
                  .then(function () { okmsg("待执行已取消（101018 回执）"); load(); }).catch(function () {});
              });
          };
        });
      }).catch(function (e) {
        // 空队列/加载失败/陈旧都能渲染（S11 验收：不吞异常停在「尚未加载」）
        if ($("queue-body").querySelector("button[data-rm]")) {
          Q_STALE = true;
          setStale("q-stale", (e && e.timeout) ? "刷新超时" : "刷新失败——移到队首/取消/清空点击将被拦截并提示，刷新成功后恢复");
        } else {
          setState($("queue-body"), (e && e.timeout) ? "timeout" : "error", 7, "", errName(e));
        }
      });
    });
  }
  $("q-refresh").onclick = load;
  $("q-target").onchange = load;
  bindAuto("q-auto", load);
  $("q-clear").onclick = function () {
    var t = $("q-clear-target").value.trim();
    if (!t) { banner("清空必须指定目标（设备/robot 寻址串）——不提供全局清空。"); return; }
    if (Q_STALE) { banner("队列数据已过期：请先刷新成功后再操作。"); return; }
    confirmBox("清空该目标的待执行队列",
      "<p>确认清空目标 <span class='mono'>" + esc(t) + "</span> 的<b>全部 queued</b> 待执行指令？</p>" +
      "<ul class='expl'><li>仅影响该目标的 queued 指令（精确范围）；逐条落 101018 取消回执，不可撤销。</li>" +
      "<li>已下发（dispatched/acked/running）指令不在清空范围内，也没有取消入口。</li>" +
      "<li>这是「服务器待派发队列」操作——与向端侧发送 type 304 清空设备待执行队列是不同动作。</li></ul>",
      "确认清空", function () {
        api("DELETE", "/api/v1/admin/queue?target=" + encodeURIComponent(t))
          .then(function (j) { okmsg("已清空 " + j.cleared + " 条（101018 回执）"); load(); }).catch(function () {});
      });
  };
  load();
}

/* ============ 任务工作区 · 审批（S10 + P0-3 决议令牌） ============ */
function renderApprovals() {
  $("view").innerHTML = wsTabs("tasks", "tasks-approvals") +
    "<div class='pagehead'><div><h2 class='view'>审批</h2>" +
    "<p class='sub'>GET /api/v1/admin/approvals + POST …/{approvalId}/decision · 决议只认 approver 决议令牌（P0-3）；决议人身份=令牌，须独立于申请人（FR-53）</p></div></div>" +
    "<section class='card'><h3>审批门说明 <span class='hint'>L2 = 高风险动作独立审批</span></h3><div id='ap-expl' class='dim'>指令目录加载中…</div>" +
    "<p class='note'>决议请求使用下方「决议令牌」（服务器以 <span class='mono'>-issue-approver-token</span> 签发，仅存 hash；与本页登录用的管理令牌<b>分开持有</b>——管理令牌决议会被拒绝 403 APPROVER_SCOPE_REQUIRED，结构性消灭自批，P0-3）。" +
    "列表读取仍走管理令牌。决议留痕身份 = <span class='mono'>approver-token:&lt;hash 前 16 位&gt;</span>，「决议人（展示）」自由文本仅作展示后缀拼入（可留空）。" +
    "批准后任务变为「已批准，待提交」，由申请人在「新建任务」携审批号继续（批准不自动执行）。</p></section>" +
    "<section class='card'><div class='row'><button id='refresh-approvals' class='mini'>刷新</button>" +
    "<label>决议令牌 <input id='approver-token' type='password' placeholder='approver Bearer Token（决议专用）' size='22' autocomplete='off'></label>" +
    "<button id='save-approver-token' class='primary mini'>保存决议令牌</button>" +
    "<button id='clear-approver-token' class='mini'>清除</button>" +
    "<label>决议人（展示） <input id='approver' placeholder='自由文本，仅展示后缀（可留空）' size='14'></label>" +
    "<label>状态 <select id='ap-status'><option value='pending'>待决议 pending</option><option value='approved'>已批准 approved</option><option value='rejected'>已拒绝 rejected</option><option value='consumed'>已消费 consumed</option></select></label>" +
    "<span class='dim' id='ap-cat-note'></span></div>" +
    "<table><thead><tr><th>审批号</th><th>申请人</th><th>目标</th><th>动作</th><th>风险</th><th>决议理由</th><th>登记时间</th><th>决议操作</th></tr></thead>" +
    "<tbody id='approvals-body'><tr><td colspan='8' class='empty'>加载中…</td></tr></tbody></table>" +
    "<p class='note'>决议令牌记住在本浏览器（localStorage，仅本机便利性——不作为身份凭证；与管理令牌同口径：服务端仅存 SHA-256 hash）；拒绝时请在行内填写原因（≤512 字符）。</p></section>";
  $("approver-token").value = approverToken;
  $("approver").value = localStorage.getItem(APPROVER_KEY) || "";
  $("approver").addEventListener("change", function () { localStorage.setItem(APPROVER_KEY, $("approver").value.trim()); });
  $("save-approver-token").onclick = function () {
    approverToken = $("approver-token").value.trim();
    localStorage.setItem(APPROVER_TOKEN_KEY, approverToken);
    okmsg(approverToken ? "决议令牌已保存（仅存本浏览器 localStorage）" : "决议令牌为空");
  };
  $("clear-approver-token").onclick = function () {
    approverToken = ""; localStorage.removeItem(APPROVER_TOKEN_KEY); $("approver-token").value = "";
    okmsg("决议令牌已清除");
  };
  function fillExpl() {
    $("ap-cat-note").textContent = CAT.ok ? "" : "（目录未载：类型显示纯数字）";
    var l2 = CAT.ok
      ? CAT.commands.filter(function (c) { return c.risk === "L2"; })
        .map(function (c) { return "<b>" + esc(c.name) + "</b>（" + c.type + "）"; }).join("、")
      : "<span style='color:var(--warn)'>目录未载——L2 清单暂不可用，请切页重试（分级口径以服务端目录/设置页分级查询为准）</span>";
    $("ap-expl").innerHTML = "<b>L2 = 高风险动作</b>" + (CAT.riskLegend.L2 ? "：" + esc(CAT.riskLegend.L2) : "") + "<br>" +
      "当前目录中的 L2 动作：" + l2 + "。<br>" +
      "L2 提交后<b>不直达设备</b>：先登记待审批；须由持决议令牌的独立决议人（≠申请人）逐条批准/拒绝；" +
      "批准后申请人在「新建任务」携审批号继续提交（高级模式回填或审批卡片一键提交）。</div>";
  }
  function decide(id, decision) {
    if (!approverToken) { banner("请先在服务器以 -issue-approver-token 签发决议令牌并点「保存决议令牌」粘贴（管理令牌不能决议，403 APPROVER_SCOPE_REQUIRED）。"); return; }
    var approver = $("approver").value.trim();
    var inp = document.querySelector("input[data-reason='" + id + "']");
    var reason = inp ? inp.value.trim() : "";
    if (decision === "reject" && !reason) { banner("拒绝必须填写原因（目标要求：拒绝不可无声）。"); return; }
    // 决议请求 Authorization 用 approver 决议令牌（P0-3）；列表等其他请求仍走管理令牌。
    api("POST", "/api/v1/admin/approvals/" + encodeURIComponent(id) + "/decision",
      { approver: approver, decision: decision, reason: reason }, approverToken)
      .then(function (j) {
        okmsg("决议完成（" + (decision === "approve" ? "已批准" : "已拒绝") + "）：" + id +
          " · 留痕身份 " + (j && j.approver ? j.approver : "") +
          (decision === "approve" ? " · 请申请人在「新建任务」携审批号继续提交" : ""));
        load();
      }).catch(function (e) {
        if (e && e.status === 403) banner("决议被拒（403）：决议只认 approver 决议令牌（管理令牌 403 APPROVER_SCOPE_REQUIRED；approver≠actor 冲突同样 403）。");
        if (e && e.status === 409) banner("并发决议冲突（409）：该审批已被处理——列表将刷新展示已有决定，不会重复执行。");
      });
  }
  function load() {
    setState($("approvals-body"), "loading", 8);
    loadCatalog().then(function () {
      fillExpl();
      api("GET", "/api/v1/admin/approvals?status=" + $("ap-status").value).then(function (j) {
        var rows = (j.approvals || []).map(function (a) {
          var act = a.status === "pending"
            ? "<input data-reason='" + esc(a.approvalId) + "' placeholder='拒绝原因（必填）' size='14'> " +
              "<button class='ok mini' data-approve='" + esc(a.approvalId) + "'>批准</button> " +
              "<button class='no mini' data-reject='" + esc(a.approvalId) + "'>拒绝</button>"
            : "<span class='dim'>" + esc(a.approver || "—") + (a.decidedAtMs ? " · " + fmtMs(a.decidedAtMs) : "") + "</span>";
          return "<tr><td>" + shortId(a.approvalId) + "</td><td>" + esc(a.actor) + "</td>" +
            "<td class='mono'>" + esc(shortIdPlain(a.target)) + "</td><td>" + typeCell(a.type) + (a.recurring ? " <span class='pill warn'>常设</span>" : "") + "</td>" +
            "<td>" + riskPill(a.riskClass) + "</td><td>" + esc(a.reason || "—") + "</td>" +
            "<td class='mono'>" + fmtMs(a.createdAtMs) + "</td><td>" + act + "</td></tr>";
        });
        $("approvals-body").innerHTML = rows.join("") || "<tr><td colspan='8' class='empty'>无该状态审批</td></tr>";
        forEach("[data-approve]", function (b) { b.onclick = function () { decide(b.getAttribute("data-approve"), "approve"); }; });
        forEach("[data-reject]", function (b) { b.onclick = function () { decide(b.getAttribute("data-reject"), "reject"); }; });
      }).catch(function (e) {
        setState($("approvals-body"), (e && e.timeout) ? "timeout" : "error", 8, "", errName(e));
      });
    });
  }
  $("refresh-approvals").onclick = load;
  $("ap-status").onchange = load;
  load();
}

/* ============ 任务工作区 · 定时任务（W-ops：cron 管理面——列表/创建/预览/启停/删除） ============ */

    "<div class='row'><button id='cj-refresh' class='mini'>刷新</button><label><input type='checkbox' id='cj-auto'> 每 5s 自动刷新</label></div>" +

    "<tbody id='cj-body'><tr><td colspan='10' class='empty'>加载中…</td></tr></tbody></table>" +
    "<p class='note'>启用中任务由服务端每 15s 扫描到期触发，触发指令走与手动提交同一条统一管线（幂等键 = cron-{jobId}-{计划时刻}）；上次触发指令未终态（设备离线积压）时跳过本次并推进下次时刻（堆积保护）。删除不移除历史触发的指令记录（审计不可毁）。</p></section>" +
    "<section class='card'><h3>创建任务 <span class='hint'>POST /api/v1/admin/cron-jobs · 服务端解析表达式并返回 next 触发预览</span></h3>" +
    "<div class='row'><label>名称 <input id='cjr-name' size='16' placeholder='如 每日巡检'></label>" +
    "<label>目标 <input id='cjr-target' list='cjr-robots' size='18' placeholder='deviceId 或 robotId'><datalist id='cjr-robots'></datalist></label>" +
    "<label>指令类型 <input id='cjr-type' size='6' placeholder='如 503'></label>" +
    "<label>cron <input id='cjr-expr' size='14' placeholder='30 9 * * *'></label>" +

    "<label>常设审批号 <input id='cjr-approval' size='20' placeholder='L2 任务必填（Recurring=true）'></label>" +
    "<button id='cjr-create' class='primary mini'>创建</button></div>" +
    "<div class='dim mono' id='cjr-preview-out'></div>" +

  loadCatalog();
  function load() {
    setState($("cj-body"), "loading", 10);

      api("GET", "/api/v1/admin/devices").catch(function () { return null; })
    ]).then(function (r) {
      var jobs = (r[0] && r[0].jobs) || [];
      var robots = [], seen = {};
      ((r[1] && r[1].devices) || []).forEach(function (d) {
        if (d.robotId && !seen[d.robotId]) { seen[d.robotId] = 1; robots.push(d.robotId); }
      });
      $("cjr-robots").innerHTML = robots.sort().map(function (rb) { return "<option value='" + esc(rb) + "'>"; }).join("");
      var rows = jobs.map(function (j) {
        return "<tr>" +
          "<td>" + esc(j.name) + "</td>" +
          "<td class='mono'>" + esc(j.cronExpr) + "</td>" +
          "<td class='mono'>" + esc(shortIdPlain(j.target)) + "</td>" +
          "<td>" + typePill(j.type, j.riskClass) + "</td>" +
          "<td>" + riskPill(j.riskClass) + "</td>" +
          "<td><span class='pill " + (j.enabled ? "st-succeeded" : "st-dead") + "'>" + (j.enabled ? "启用中" : "已停用") + "</span></td>" +
          "<td class='mono'>" + fmtMs(j.lastFireMs) + "</td>" +
          "<td>" + (j.lastResult ? stPill(j.lastResult) : "<span class='dim'>未触发</span>") + "</td>" +
          "<td class='mono'>" + fmtMs(j.nextFireMs) + "</td>" +
          "<td><button class='mini' data-cjtoggle='" + esc(j.jobId) + "|" + (j.enabled ? "0" : "1") + "'>" + (j.enabled ? "停用" : "启用") + "</button> " +
          "<button class='no mini' data-cjdel='" + esc(j.jobId) + "|" + esc(j.name) + "'>删除</button></td>" +
          "</tr>";
      });
      $("cj-body").innerHTML = rows.join("") ||
        "<tr><td colspan='10' class='empty'>暂无定时任务：用下方「创建任务」登记（cron 表达式 5 字段，服务端 UTC 触发）。</td></tr>";
      forEach("[data-cjtoggle]", function (btn) {
        btn.onclick = function () {
          var parts = btn.getAttribute("data-cjtoggle").split("|");
          api("POST", "/api/v1/admin/cron-jobs/" + encodeURIComponent(parts[0]) + "/enabled",
            { enabled: parts[1] === "1" })
            .then(function (j2) { okmsg("任务已" + (j2.enabled ? "启用" : "停用")); load(); }).catch(function () {});
        };
      });
      forEach("[data-cjdel]", function (btn) {
        btn.onclick = function () {
          var parts = btn.getAttribute("data-cjdel").split("|");
          confirmBox("删除定时任务", "<p>确认删除 <b>" + esc(parts[1]) + "</b>（" + esc(parts[0]) + "）？删除后不再触发；历史触发的指令记录保留。操作落审计。</p>", "删除", function () {
            api("DELETE", "/api/v1/admin/cron-jobs/" + encodeURIComponent(parts[0]))
              .then(function () { okmsg("任务已删除"); load(); }).catch(function () {});
          });
        };
      });
    }).catch(function (e) {
      setState($("cj-body"), (e && e.timeout) ? "timeout" : "error", 10, "", errName(e));
    });
  }
  $("cjr-preview").onclick = function () {
    var expr = $("cjr-expr").value.trim();
    if (!expr) { banner("先填写 cron 表达式（5 字段）。"); return; }
    api("GET", "/api/v1/admin/cron-jobs/preview?expr=" + encodeURIComponent(expr) + "&limit=5")
      .then(function (j) {
        $("cjr-preview-out").textContent = "未来触发（UTC）：\n" + (j.previewUtc || []).join("\n");
        banner("");
      }).catch(function () {});
  };
  $("cjr-create").onclick = function () {
    var body = { name: $("cjr-name").value.trim(), target: $("cjr-target").value.trim(), cronExpr: $("cjr-expr").value.trim() };
    body.type = parseInt($("cjr-type").value, 10);
    if (!body.name || !body.target || !body.cronExpr) { banner("名称/目标/cron 表达式必填。"); return; }
    if (!isFinite(body.type)) { banner("指令类型须为数字（目录见「新建任务」页）。"); return; }
    var paramsRaw = $("cjr-params").value.trim();
    if (paramsRaw) {
      try { body.params = JSON.parse(paramsRaw); }
      catch (e) { banner("参数 JSON 解析失败：" + e.message); return; }
    }
    var approval = $("cjr-approval").value.trim();
    if (approval) body.approvalId = approval;
    api("POST", "/api/v1/admin/cron-jobs", body).then(function (j) {
      var first = (j.previewUtc || [])[0];
      okmsg("任务已创建（jobId " + j.job.jobId + "）· 首次触发 " + (first ? first.replace("T", " ").replace("Z", " UTC") : fmtMs(j.nextFireMs)));
      load();
    }).catch(function () {});
  };
  $("cj-refresh").onclick = load;
  bindAuto("cj-auto", load);
  load();
}

/* ============ 集成 · 回调配置（S12：类型说明 + 按 robot 分组 + 单一保存 + 测试/删除） ============ */
var CB_TYPES = {
  1:  { name: "指令结果回调", desc: "指令终态回执（exec_result，含 errorCode 与结果 JSON），按提交目标对应的 robot 寻址" },
  11: { name: "消息与查询推送回调", desc: "消息上报与查询推送（511 会议 / 512 群成员 / 513 设备资源 / 514 日志片段 / 515 群名 等）" },
  0:  { name: "群二维码回调", desc: "群二维码生成结果推送" },
  5:  { name: "机器人上线回调", desc: "robot 上线事件推送" },
  6:  { name: "机器人下线回调", desc: "robot 下线事件推送" }
};
function cbTypePill(t) {
  var info = CB_TYPES[t];
  var cls = t === 1 ? " cb1" : t === 11 ? " cb11" : "";
  return "<span class='pill" + cls + "'>type " + t + " · " + esc(info ? info.name : "未知类型") + "</span>";
}
function renderCallbacks() {
  $("view").innerHTML = wsTabs("integrations", "int-callbacks") +
    "<div class='pagehead'><div><h2 class='view'>回调配置</h2>" +
    "<p class='sub'>/api/v1/admin/callbacks · 每 robot 同一 type 至多一条（不同 type 可并存）· 绑定校验：目标须以 200 + application/json 应答（3s）· 默认仅 loopback（SR-09）</p></div></div>" +
    "<section class='card'><h3>回调类型说明 <span class='hint'>业务事件与触发时机</span></h3>" +
    "<ul class='expl'>" +
    "<li><b>type 1 · 指令结果回调</b>：指令到达终态（成功/失败/取消等）时推送终态回执；按提交目标对应的 robot 寻址其 type=1 绑定 URL。</li>" +
    "<li><b>type 11 · 消息与查询推送回调</b>：被动消息上报与查询类推送（511 查询会议 / 512 群成员 / 513 设备资源 / 514 日志片段 / 515 群名）。</li>" +
    "<li><b>未配置对应类型</b>：该类事件不外呼推送，仅留库（投递记录落 skipped——「未配置接收器，未投递」）。</li>" +
    "<li><b>其余枚举</b>：type 0 群二维码、type 5 上线、type 6 下线（兼容面同源枚举，可一并绑定）。</li>" +
    "<li><b>绑定即启用、删除即停用</b>（表无独立 enabled 列，故不渲染假开关）；接收器默认仅允许 loopback，外网须部署侧放行并强制 TLS（SR-01/09）。SSRF/URL/TLS 检查由服务端执行。</li>" +
    "</ul></section>" +
    "<div id='cb-groups'><div class='empty'>加载中…</div></div>" +
    "<section class='card'><h3>添加 / 更新绑定 <span class='hint'>一个「保存」：新绑定自动新增，既有绑定自动更新（POST/PUT 差异不暴露）</span></h3>" +
    "<div class='row'><label>robot <input id='cb-robot' list='cb-robots' size='18' placeholder='选择或输入 robotId'><datalist id='cb-robots'></datalist></label>" +
    "<span class='dim'>候选来自设备列表的 robot 绑定与既有回调绑定。</span></div>" +
    "<div class='row'>" +
    "<label><input type='radio' name='cb-type' value='1' checked> 1 · 指令结果回调</label>" +
    "<label><input type='radio' name='cb-type' value='11'> 11 · 消息与查询推送</label>" +
    "<label><input type='radio' name='cb-type' value='0'> 0 · 群二维码</label>" +
    "<label><input type='radio' name='cb-type' value='5'> 5 · 上线</label>" +
    "<label><input type='radio' name='cb-type' value='6'> 6 · 下线</label></div>" +
    "<p class='note' id='cb-radio-desc'></p>" +
    "<div class='row'><label>接收器 URL <input id='cb-url' placeholder='http://127.0.0.1:端口/cb' size='40'></label>" +
    "<button id='cb-save' class='primary mini'>保存</button><span class='dim'>保存前服务端会探测该 URL（200 + application/json）——探测失败即保存失败。</span></div></section>" +
    "<section class='card'><h3>测试回调地址 <span class='hint'>POST /api/v1/admin/callbacks/test · 合成探测不落库</span></h3>" +
    "<div class='row'><label>URL <input id='cbt-url' size='40' placeholder='http://127.0.0.1:端口/cb'></label>" +
    "<button id='cb-test' class='mini'>测试</button><span id='cbt-result' class='dim'></span></div>" +
    "<p class='note'>测试将向该 URL 发送<b>合成探测</b>（不使用任何业务正文，也不保存配置）；测试通过只证明当时可达，不证明未来投递成功。</p></section>";
  function selectedType() {
    var el = document.querySelector("input[name='cb-type']:checked");
    return el ? parseInt(el.value, 10) : 1;
  }
  function radioDesc() {
    var v = selectedType();
    $("cb-radio-desc").textContent = CB_TYPES[v] ? "type " + v + "：" + CB_TYPES[v].desc : "";
  }
  forEach("input[name='cb-type']", function (r) { r.onchange = radioDesc; });
  radioDesc();
  function load() {
    Promise.all([
      api("GET", "/api/v1/admin/callbacks").catch(function () { return null; }),
      api("GET", "/api/v1/admin/devices").catch(function () { return null; })
    ]).then(function (r) {
      // 修复（复核 medium）：GET 失败不得吞成假空态——区分「确定无绑定」与「加载失败」
      var cbs = r[0] ? (r[0].callbacks || []) : null;
      var devices = r[1] ? (r[1].devices || []) : [];
      if (cbs === null) {
        $("cb-groups").innerHTML = "<section class='card'><div class='empty'>回调绑定加载失败——<button class='mini' id='cb-reload'>重试</button></div></section>";
        var rr = $("cb-reload");
        if (rr) rr.onclick = load;
        return;
      }
      var seen = {}, robots = [];
      devices.forEach(function (d) { if (d.robotId && !seen[d.robotId]) { seen[d.robotId] = 1; robots.push(d.robotId); } });
      cbs.forEach(function (c) { if (!seen[c.robotId]) { seen[c.robotId] = 1; robots.push(c.robotId); } });
      $("cb-robots").innerHTML = robots.sort().map(function (rb) { return "<option value='" + esc(rb) + "'>"; }).join("");
      var groups = {}, order = [];
      cbs.forEach(function (c) {
        if (!groups[c.robotId]) { groups[c.robotId] = []; order.push(c.robotId); }
        groups[c.robotId].push(c);
      });
      if (!order.length) {
        $("cb-groups").innerHTML = "<section class='card'><div class='empty'>还没有任何回调绑定：未配置的类型不推送（事件仅留库，投递记录显示「未配置接收器，未投递」）——用下方表单为 robot 添加绑定。</div></section>";
        return;
      }
      $("cb-groups").innerHTML = order.map(function (rb) {
        var rows = groups[rb].map(function (c) {
          var info = CB_TYPES[c.type] || {};
          return "<tr><td>" + cbTypePill(c.type) + "</td>" +
            "<td class='dim'>" + esc(info.desc || c.typeName || "") + "</td>" +
            "<td class='mono'>" + esc(c.callbackUrl) + "</td>" +
            "<td><button class='mini' data-cbtest='" + esc(c.callbackUrl) + "'>测试</button> " +
            "<button class='no mini' data-cbdel='" + esc(rb) + "|" + c.type + "'>删除</button></td></tr>";
        }).join("");
        return "<section class='card'><h3 class='mono'>" + esc(rb) + "</h3>" +
          "<table><thead><tr><th>类型</th><th>含义</th><th>接收器 URL</th><th>操作</th></tr></thead><tbody>" + rows + "</tbody></table></section>";
      }).join("");
      forEach("[data-cbtest]", function (b) {
        b.onclick = function () {
          b.disabled = true;
          api("POST", "/api/v1/admin/callbacks/test", { callBackUrl: b.getAttribute("data-cbtest") })
            .then(function (j) {
              if (j.reachable) okmsg("探测通过：" + j.message + "（仅证明当时可达）");
              else banner("探测未通过：" + j.message);
            }).catch(function () {}).then(function () { b.disabled = false; });
        };
      });
      forEach("[data-cbdel]", function (b) {
        b.onclick = function () {
          var parts = b.getAttribute("data-cbdel").split("|");
          confirmBox("删除回调绑定",
            "<p>确认删除 robot <span class='mono'>" + esc(parts[0]) + "</span> 的 type=" + esc(parts[1]) + " 绑定？</p>" +
            "<p class='dim'>删除即停用该类推送（立即生效）；此后该类事件仅留库，投递记录显示「未配置接收器，未投递」。</p>",
            "确认删除", function () {
              api("DELETE", "/api/v1/admin/callbacks?robotId=" + encodeURIComponent(parts[0]) + "&type=" + parts[1])
                .then(function () { okmsg("绑定已删除（该类推送已停用）"); load(); }).catch(function () {});
            });
        };
      });
    }).catch(function () {
      $("cb-groups").innerHTML = "<section class='card'><div class='empty'>回调配置加载失败——<button class='mini' id='cb-reload'>重试</button></div></section>";
      var r = $("cb-reload");
      if (r) r.onclick = load;
    });
  }
  $("cb-save").onclick = function () {
    var body = { robotId: $("cb-robot").value.trim(), type: selectedType(), callBackUrl: $("cb-url").value.trim() };
    if (!body.robotId) { banner("robotId 必填（可从设备列表的 robot 绑定中选择）。"); return; }
    if (!body.callBackUrl) { banner("接收器 URL 必填（http(s)，默认仅 loopback）。"); return; }
    var saveBtn = $("cb-save");
    saveBtn.disabled = true;
    // 单一保存：先 PUT（仅更新既有绑定）；服务端 404 NOT_FOUND → 回退 POST 新增
    api("PUT", "/api/v1/admin/callbacks", body).then(function () {
      okmsg("绑定已保存（更新既有绑定；探测通过）"); load();
    }).catch(function (e) {
      var op = cbNextOp(e && e.status);
      if (op === "POST") {
        api("POST", "/api/v1/admin/callbacks", body).then(function () {
          okmsg("绑定已保存（新增绑定；探测通过）"); load();
        }).catch(function (e2) { banner("保存失败：" + (e2 && e2.message ? e2.message : "")); });
      } else if (e && e.status === 403) {
        banner("保存被安全策略拒绝（默认仅 loopback 接收器）：外网接收器须部署侧放行并强制 TLS——UI 不提供绕过。");
      } else {
        banner("保存失败：" + (e && e.message ? e.message : ""));
      }
    }).then(function () { saveBtn.disabled = false; });
  };
  $("cb-test").onclick = function () {
    $("cbt-result").textContent = "探测中…";
    api("POST", "/api/v1/admin/callbacks/test", { callBackUrl: $("cbt-url").value.trim() })

        $("cbt-result").textContent = "❌ 探测请求失败";
      });
  };
  load();
}

    forEach("[data-wlrm]", function (b) {
      b.onclick = function () {
        api("DELETE", "/api/v1/admin/whitelist?target=" + encodeURIComponent(wlTarget) + "&recipient=" + encodeURIComponent(b.getAttribute("data-wlrm")))
          .then(function () { okmsg("已移除"); wlLoad(); }).catch(function () {});
      };
    });
  }
  function wlLoad() {
    wlTarget = $("wl-target").value.trim();
    if (!wlTarget) { banner("先填写目标。"); return; }
    api("GET", "/api/v1/admin/whitelist?target=" + encodeURIComponent(wlTarget)).then(function (j) { wlRender(j.recipients); }).catch(function () {});
  }
  $("wl-load").onclick = wlLoad;
  $("wl-add").onclick = function () {
    wlTarget = $("wl-target").value.trim();
    var item = $("wl-item").value.trim();
    if (!wlTarget || !item) { banner("目标与接收对象均必填。"); return; }
    api("POST", "/api/v1/admin/whitelist", { target: wlTarget, recipient: item })
      .then(function () { okmsg("白名单已添加"); $("wl-item").value = ""; wlLoad(); }).catch(function () {});
  };
  loadSettings();
}

/* ============ 设置与审计 · 审计（S15：谁在什么时间对什么做了什么） ============ */
var AUDIT_CACHE = [];
function renderAuditLogs() {
  $("view").innerHTML = wsTabs("config", "audit") +
    "<div class='pagehead'><div><h2 class='view'>审计日志</h2>" +
    "<p class='sub'>GET /api/v1/admin/logs/audit · 按「谁改了什么」叙述（主体 + 对象 + 动作）；用户动作与系统状态流分列，审计事件只读不可编辑/删除</p></div></div>" +
    "<section class='card'><div class='row'>" +
    "<label>kind 过滤 <input id='al-kind' placeholder='如 admin_command_submitted' size='26'></label>" +
    "<label>每页 <select id='al-limit'><option>50</option><option>100</option><option>200</option></select></label>" +
    "<button id='al-refresh' class='mini'>查询</button>" +
    "<span class='dim'>旧版本事件无主体字段时如实显示「未记录」——不回填 admin。</span></div>" +
    "<table><thead><tr><th>时间</th><th>主体（谁）</th><th>动作（做了什么）</th><th>对象（对什么）</th><th>证据摘要</th><th>kind</th></tr></thead>" +
    "<tbody id='al-body'><tr><td colspan='6' class='empty'>加载中…</td></tr></tbody></table>" +
    "<p class='note'>点「证据」查看原始 detail（含关联键）；导出能力服务端未提供（如实标注，不虚构导出按钮）。</p></section>";
  function load() {
    setState($("al-body"), "loading", 6);
    var q = "?limit=" + $("al-limit").value;
    if ($("al-kind").value.trim()) q += "&kind=" + encodeURIComponent($("al-kind").value.trim());
    api("GET", "/api/v1/admin/logs/audit" + q).then(function (j) {
      AUDIT_CACHE = j.entries || [];
      var rows = AUDIT_CACHE.map(function (e, i) {
        var n = auditNarrative(e);
        return "<tr><td class='mono'>" + fmtMs(e.atMs) + "</td>" +
          "<td>" + esc(n.actor) + "</td>" +
          "<td><b>" + esc(n.action) + "</b></td>" +
          "<td class='mono'>" + esc(shortIdPlain(n.object)) + "</td>" +
          "<td class='dim'><button class='mini' data-audit='" + i + "'>证据</button></td>" +
          "<td><span class='pill'>" + esc(e.kind || "—") + "</span></td></tr>";
      });
      $("al-body").innerHTML = rows.join("") || "<tr><td colspan='6' class='empty'>无匹配审计记录</td></tr>";
      forEach("[data-audit]", function (b) {
        b.onclick = function () {
          var e = AUDIT_CACHE[parseInt(b.getAttribute("data-audit"), 10)];
          if (!e) return;
          var n = auditNarrative(e);
          openModal("<h3>审计证据<button class='mini' onclick='closeModal()'>关闭</button></h3>" +
            "<table><tr><th>时间</th><td class='mono'>" + fmtMs(e.atMs) + " <span class='dim'>（ISO：</span><span class='mono'>" + esc(new Date(e.atMs).toISOString()) + "</span><span class='dim'>）</span></td></tr>" +
            "<tr><th>叙述</th><td>" + esc(n.actor) + " · " + esc(n.action) + " · 对象 <span class='mono'>" + esc(n.object) + "</span>" + (n.extra ? " · " + esc(n.extra) : "") + "</td></tr>" +
            "<tr><th>kind</th><td class='mono'>" + esc(e.kind || "—") + "</td></tr>" +
            "<tr><th>原始 detail</th><td class='mono' style='word-break:break-all'>" + esc(e.detail || "—") + "</td></tr></table>" +
            "<p class='note'>正文/秘密字段已由服务端审计策略脱敏；本页不做编辑、删除或导出。</p>");
        };
      });
    }).catch(function (e) {
      setState($("al-body"), (e && e.timeout) ? "timeout" : "error", 6, "", errName(e));
    });
  }
  $("al-refresh").onclick = load;
  $("al-kind").onchange = load;
  $("al-limit").onchange = load;
  load();
}

/* ============ 会话（顶栏）：令牌管理（逻辑保留：localStorage + #token= 深链吸收） ============ */
function setAuthPill() {
  var el = $("auth-state");
  if (token) { el.className = "pill on"; el.textContent = "已认证"; }
  else { el.className = "pill warn"; el.textContent = "未设置令牌"; }
}
$("open-session").onclick = function () {
  openModal(
    "<h3>会话与管理令牌<button class='mini' onclick='closeModal()'>关闭</button></h3>" +
    "<p class='dim'>管理面 Bearer Token 仅保存在本浏览器 localStorage（不进 URL/日志；服务端仅存 SHA-256 hash）。修改后点「保存」以新令牌重载当前视图。</p>" +
    "<div class='row'><input id='token' type='password' placeholder='管理面 Bearer Token' autocomplete='off' size='32'>" +
    "<button id='save-token' class='primary mini'>保存</button><button id='clear-token' class='mini'>清除</button></div>" +
    "<p class='note'>401 时所有写操作被拒绝并引导回本面板；签发管理面令牌须在服务器以 <span class='mono'>-issue-admin-token</span> 启动参数完成（打印后退出）；审批决议令牌另以 <span class='mono'>-issue-approver-token</span> 签发、在「任务 → 审批」页单独保存（P0-3 分持）。清除仅移除本浏览器副本——服务端令牌撤销能力未提供时不声称「全设备已退出」。</p>", true);
  $("token").value = token;
  $("save-token").onclick = function () {
    token = $("token").value.trim();
    localStorage.setItem(TOKEN_KEY, token);
    setAuthPill();
    closeModal();
    okmsg("令牌已保存——正在以新令牌重载当前视图");
    route();
  };
  $("clear-token").onclick = function () {
    token = ""; localStorage.removeItem(TOKEN_KEY);
    $("token").value = "";
    setAuthPill();
    okmsg("已清除本浏览器保存的令牌");
  };
  setAuthPill();
};

/* ============ 启动 ============ */
setInterval(function () {
  var el = $("sync-time");
  if (!el) return;
  el.textContent = window.__lastSync
    ? "数据更新于 " + new Date(window.__lastSync).toISOString().replace("T", " ").slice(0, 19) + " UTC"
    : "尚未加载数据";
}, 1000);
setAuthPill();
route();
</script>
</body>
