# 版本目录（T1.2 基线 + T2.2 协议层）：AGP 8.5+ / Kotlin 1.9+ / JDK17
# 约束：compileSdk 34 / targetSdk 34 / minSdk 26（docs/01 §支持环境）
# 依赖策略（SR-03 / 门禁 G3）：零遥测——除下列运行时依赖（OkHttp=网络、
# kotlinx-serialization=JSON 编解码，docs/03 T2.2 指定）与 JUnit 系测试依赖外
# 不引入任何第三方库；统计/埋点/崩溃收集 SDK 一律禁止。
[versions]
agp = "8.5.2"
kotlin = "1.9.24"
junit = "4.13.2"
kotlinxSerialization = "1.6.3"
okhttp = "4.12.0"

[libraries]
# 唯一测试依赖基线：JUnit4（无任何统计/遥测 SDK —— SR-03 / G3）
junit = { module = "junit:junit", version.ref = "junit" }

# T2.2 core:protocol（规格 protocol/spec.md §4/§5）
# - kotlinx-serialization：v1 兼容信封（WeworkMessageListBean）与 v2 帧 JSON 编解码
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# - OkHttp：WS 客户端 + 配对 HTTP（车道任务卡指定的唯一网络依赖）
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# - MockWebServer：仅测试（JVM 起 WS/HTTP 假端点，CI 必跑）
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
