# 版本目录（T1.2 基线）：AGP 8.5+ / Kotlin 1.9+ / JDK17
# 约束：compileSdk 34 / targetSdk 34 / minSdk 26（docs/01 §支持环境）
[versions]
agp = "8.5.2"
kotlin = "1.9.24"
junit = "4.13.2"

[libraries]
