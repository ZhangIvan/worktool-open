# OFFLINE CANDIDATE ONLY. Do not publish without the reviewed execution authorization.
name: Go authority owner-only PostgreSQL acceptance
'on':
  push:
    branches: [worktool/synthetic-prototype]
    paths:
      - 'backend-go/internal/callback/durableauthority/authority_pg_fixture_test.go'
      - 'backend-go/internal/callback/durableauthority/authority_pg_integration_test.go'
      - 'docs/ci-authority-pg-integration.md'
      - 'scripts/authority-pg-ci.cases.json'
      - 'scripts/authority-pg-ci.py'
      - 'scripts/authority-pg-ci.sh'
      - '.github/workflows/go-authority-pg-integration.yml'
      - 'scripts/upstream-go-acquire.py'
permissions:
  contents: read
concurrency:
  # Deliberately identical to the OLD PG workflow's evaluated group.
  group: go-pg-integration-Go isolated PostgreSQL integration candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authority-owner-only:
    if: github.repository == 'ZhangIvan/worktool-open' && github.event_name == 'push' && github.ref == 'refs/heads/worktool/synthetic-prototype' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOENV: 'off'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOTELEMETRY: 'off'
      GOFLAGS: '-mod=readonly'
      GOMAXPROCS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Establish setup deadline and single-run identity
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          test -d /proc/self/fd
          test ! -e "/tmp/worktool-authority-$(id -u)"
          test ! -L "/tmp/worktool-authority-$(id -u)"
          printf 'AUTHORITY_SETUP_START=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
          printf 'GOPATH=%s/authority-go-path\nGOCACHE=%s/authority-go-cache\nGOMODCACHE=%s/authority-go-modules\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Verify direct-parent publication and every frozen source byte
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYCODE'
          import hashlib, os, pathlib, stat, subprocess
          root=pathlib.Path.cwd()
          wf='.github/workflows/go-authority-pg-integration.yml'
