      - name: Acquire exact official upstream archive and verify before exposing Go
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test "$AUTHORITY_SOURCE_VERIFIED" = 1
          printf 'AUTHORITY_ACQUIRE_ATTEMPTED=1\n' >> "$GITHUB_ENV"
          key="$GITHUB_RUN_ID-1-$GITHUB_SHA"
          timeout --signal=TERM --kill-after=5s 245s python3 -B scripts/upstream-go-acquire.py acquire "$key"
          toolchain="/tmp/worktool-upstream-go-$(id -u)-$key/toolchain"
          printf '%s/bin\n' "$toolchain" >> "$GITHUB_PATH"
          printf 'GOROOT=%s\n' "$toolchain" >> "$GITHUB_ENV"
      - name: Verify entire toolchain before approved read-only module acquisition
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYCODE'
          import importlib.util, pathlib, shutil
          spec=importlib.util.spec_from_file_location('authority', 'scripts/authority-pg-ci.py')
          h=importlib.util.module_from_spec(spec); spec.loader.exec_module(h)
          print('TOOLCHAIN_BYTES_VERIFIED' if h.toolchain_identity(str(pathlib.Path(shutil.which('go')).resolve())) else '')
          PYCODE
          cd backend-go
          timeout --signal=TERM --kill-after=5s 110s env GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go mod download
          timeout --signal=TERM --kill-after=5s 30s env GOPROXY=off GOSUMDB=off go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Separately approved anonymous pinned image acquisition, never a fixture fallback
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYCODE'
          import importlib.util, json, os, pathlib, tempfile
          spec=importlib.util.spec_from_file_location('authority', 'scripts/authority-pg-ci.py')
          h=importlib.util.module_from_spec(spec); spec.loader.exec_module(h)
          identity=h.docker_preflight()
          with tempfile.TemporaryDirectory(prefix='authority-pull-',dir=os.environ['RUNNER_TEMP']) as config:
              pathlib.Path(config,'config.json').write_text('{"auths":{}}')
              env={'PATH':'/usr/bin:/bin','HOME':config,'LANG':'C','LC_ALL':'C'}
              h.checked([identity['executable'],'--config',config,'--host','unix:///var/run/docker.sock','pull','--platform=linux/amd64',h.IMAGE],env=env,timeout=180,limit=1048576)
              assert h.docker_preflight()==identity
          print('PINNED_IMAGE_PREPARATION_COMPLETED')
          PYCODE
      - name: One offline owner-only fixture, full internal fifteen-minute budget
        timeout-minutes: 16
        shell: bash
        run: |
          set -euo pipefail
          test "$AUTHORITY_SOURCE_VERIFIED" = 1
          test "$(( $(date +%s) - AUTHORITY_SETUP_START ))" -le 600
          test ! -e "/tmp/worktool-authority-$(id -u)"
          test ! -L "/tmp/worktool-authority-$(id -u)"
          printf 'AUTHORITY_LAUNCH_ATTEMPTED=1\n' >> "$GITHUB_ENV"
          bash scripts/authority-pg-ci.sh run "/tmp/worktool-authority-$(id -u)" "$(readlink -f "$(command -v go)")" --execute-reviewed-stage-a
      - name: Always reconcile only recorded owned state, never force-clear a lease
        if: ${{ always() }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          if test "${AUTHORITY_SOURCE_VERIFIED:-}" != 1 || test "${AUTHORITY_LAUNCH_ATTEMPTED:-}" != 1; then
            printf '%s\n' 'No verified fixture launch; no cleanup authority used.'
            exit 0
          fi
          timeout --signal=TERM --kill-after=5s 85s python3 -B - <<'PYCODE'
          import hashlib, importlib.util, os, pathlib, stat
          script=pathlib.Path('scripts/authority-pg-ci.py')
          assert hashlib.sha256(script.read_bytes()).hexdigest()=='ecd266a46ad0a5395aca549c5149524439d8c46f60f2822dbb51a14ef0cb007c'
          spec=importlib.util.spec_from_file_location('authority',str(script))
          h=importlib.util.module_from_spec(spec); spec.loader.exec_module(h)
          os.umask(0o077)
          root='/tmp/worktool-authority-'+str(os.getuid())
          tmp=os.open('/tmp',os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
          t=os.fstat(tmp); assert t.st_uid==0 and stat.S_IMODE(t.st_mode)==0o1777
          try:
              try: fd=os.open(pathlib.Path(root).name,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW,dir_fd=tmp)
              except FileNotFoundError:
                  print('NO_OWNED_STATE_PRESENT'); raise SystemExit(0)
              try:
                  s=os.fstat(fd); assert s.st_uid==os.getuid() and stat.S_IMODE(s.st_mode)==0o700
                  if not os.listdir(fd):
                      print('NO_RETAINED_OWNED_STATE'); raise SystemExit(0)
                  nonce=h.bounded_file_at(fd,'fixture.lock',32)[0].decode('ascii')
                  assert h.HEX32.fullmatch(nonce)
                  # RunState and cleanup independently validate exact nonce/state,
                  # executable/socket identity and owned container before deletion.
                  print(h.cleanup(root,nonce))
              finally: os.close(fd)
          finally: os.close(tmp)
          PYCODE
      - name: Reconcile only verified exact upstream toolchain state
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          if test "${AUTHORITY_SOURCE_VERIFIED:-}" != 1 || test "${AUTHORITY_ACQUIRE_ATTEMPTED:-}" != 1; then
            printf '%s\n' 'No verified acquisition attempt; no toolchain cleanup authority used.'
            exit 0
          fi
          printf '%s  %s\n' '82cc5f183304e3c791d332cde4e52f548c1ba601512230aa9a86de2c19ec8d09' 'scripts/upstream-go-acquire.py' | sha256sum --check --strict
          timeout --signal=TERM --kill-after=5s 50s python3 -B scripts/upstream-go-acquire.py cleanup "$GITHUB_RUN_ID-1-$GITHUB_SHA"
