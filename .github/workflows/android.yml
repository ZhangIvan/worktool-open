name: android

# T1.2+T2.2（L1 车道）：android 构建与 JVM 单测（协议单测必跑）。
# DoD：T1.2 CI 出 debug APK；T2.2 协议单测（夹具正反例 + hmac-vector 金标准 +
# 分支覆盖率 ≥80%，docs/03 §2）随本流水线执行。
# T2.2 修订（关闭 AUD-03 C-8）：paths 增加 protocol/**（协议权威件变更触发端侧
# 单测复核——夹具即冻结测试接口，spec §7）；push/pull_request 统一分支过滤
# main/zcode/main（此前 pull_request 无分支过滤，与 push 不一致）。

on:
  push:
    branches: [main, zcode/main]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main, zcode/main]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Release 签名（docs/ops/SIGNING.md §2）：secrets 齐备才执行 assembleRelease，
# 任一缺失（secrets 未配置时为空串）则自动跳过 —— debug 签名先行。
# C-7 修复（docs/04 §8，W-M4）：keystore 以 base64 secret（WORKTOOL_KEYSTORE_B64）
# 传入，构建期内解码落盘到 $RUNNER_TEMP（绝不入库/不回显/不上传 artifact），
# WORKTOOL_STORE_FILE 由落盘步骤写入 GITHUB_ENV（绝对路径）——build.gradle.kts
# 对绝对路径按原样解析。WORKTOOL_STORE_FILE 不在 job env 静态注入，唯一来源即
# 落盘步骤，避免 job env 与 GITHUB_ENV 双源覆盖歧义。
env:
  WORKTOOL_STORE_PASSWORD: ${{ secrets.WORKTOOL_STORE_PASSWORD }}
  WORKTOOL_KEY_ALIAS: ${{ secrets.WORKTOOL_KEY_ALIAS }}
  WORKTOOL_KEY_PASSWORD: ${{ secrets.WORKTOOL_KEY_PASSWORD }}

jobs:
  build:
    name: assembleDebug + test（JDK17 / AGP 8.5 / Gradle 8.7）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # C-7：base64 secret 落盘（在任意 gradle 运行前执行——签名配置在配置期即校验
      # 文件存在）。仅当 WORKTOOL_KEYSTORE_B64 配置时生效；文件只进当轮 runner 临时
      # 目录，日志无回显（set +x），job 结束随 runner 销毁。
      - name: Release 签名密钥落盘（WORKTOOL_KEYSTORE_B64 → $RUNNER_TEMP）
        if: secrets.WORKTOOL_KEYSTORE_B64 != ''
        env:
          WORKTOOL_KEYSTORE_B64: ${{ secrets.WORKTOOL_KEYSTORE_B64 }}
        run: |
          set -e
          printf '%s' "$WORKTOOL_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/worktool-open.jks"
          echo "WORKTOOL_STORE_FILE=$RUNNER_TEMP/worktool-open.jks" >> "$GITHUB_ENV"

      - name: JDK 17（temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7（AGP 8.5 要求 ≥8.7；含构建缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 debug APK + JVM 单测
        run: gradle --no-daemon assembleDebug test

      - name: 协议分支覆盖率（T2.2 DoD ≥80% 硬门禁；BRANCH 计数器）
        run: |
          gradle --no-daemon :core:protocol:jacocoTestReport
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse('core/protocol/build/reports/jacoco/test/jacocoTestReport.xml').getroot()
          for c in root.findall('counter'):
              m, cv = int(c.get('missed')), int(c.get('covered'))
              print(f"{c.get('type')}: covered={cv} missed={m} = {100*cv/(cv+m):.1f}%")
          b = [c for c in root.findall('counter') if c.get('type') == 'BRANCH'][0]
          m, cv = int(b.get('missed')), int(b.get('covered'))
          pct = 100 * cv / (cv + m)
          assert pct >= 80, f"分支覆盖率 {pct:.1f}% < 80%（docs/03 T2.2 DoD：协议单测 ≥80% 分支）"
          print(f"BRANCH {pct:.1f}% >= 80% 达标")
          EOF

      - name: 上传协议覆盖率报告（T2.2 证据产物）
        uses: actions/upload-artifact@v4
        with:
          name: protocol-jacoco-report
          path: android/core/protocol/build/reports/jacoco/test/

      - name: Release 构建（签名 env 齐备时；缺失则跳过）
        if: >-
          env.WORKTOOL_STORE_FILE != '' &&
          env.WORKTOOL_STORE_PASSWORD != '' &&
          env.WORKTOOL_KEY_ALIAS != '' &&
          env.WORKTOOL_KEY_PASSWORD != ''
        run: gradle --no-daemon assembleRelease

      - name: 上传 debug APK（T1.2 DoD 产物）
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 上传 release APK（如已执行签名构建）
        if: >-
          env.WORKTOOL_STORE_FILE != '' &&
          env.WORKTOOL_STORE_PASSWORD != '' &&
          env.WORKTOOL_KEY_ALIAS != '' &&
          env.WORKTOOL_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
